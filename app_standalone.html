["• ",r.jsx("strong",{children:"ASAP:"})," As Soon As Possible (เร็วที่สุดเท่าที่จะทำได้)"]}),r.jsxs("li",{children:["• ",r.jsx("strong",{children:"FYI:"})," For Your Information (แจ้งเพื่อทราบ)"]}),r.jsxs("li",{children:["• ",r.jsx("strong",{children:"ETA:"})," Estimated Time of Arrival (เวลาที่จะมาถึงโดยประมาณ)"]}),r.jsxs("li",{children:["• ",r.jsx("strong",{children:"CC vs BCC:"})," CC ทุกคนเห็นอีเมลกัน / BCC ซ่อนอีเมลผู้รับเพื่อความเป็นส่วนตัว"]})]})]})]})]})]})}const Fd=[{id:"track-1",title:"IELTS Listening: BuildRight Recruitment & Sector Trends (Activity 25)",unit:"Unit 6",speaker:"Alex Johnson (Recruitment Consultant)",accent:"en-GB",description:"บทบรรยายแนะนำภาคอุตสาหกรรมก่อสร้าง ความต้องการอาคารประหยัดพลังงาน (green tech) และการลงทุนโครงสร้างพื้นฐานของรัฐบาล",text:"Hello, everyone. My name is Alex Johnson and I’m a recruitment consultant at BuildRight Recruitment. We’re an agency that specializes in providing staff for the construction industry. Now I understand that you’re all final year students in the School of Engineering and you’re interested in working in construction. So, I’d like to talk to you today about some of the opportunities available and the skills you’ll need to succeed in this sector. Construction is a diverse field which involves the building of many different types of premises. Of course, the main two types of premises are residential properties and commercial properties. At the moment, we’re seeing increasing demand for properties that are built using energy efficient materials and green technologies to keep up with tightening regulations. Supply depots and storage facilities are another type of construction that you could be involved in depending on your job. Also, governments worldwide are investing heavily in updating and expanding infrastructure leading to a surge in projects related to roads, bridges, and bus, and rail networks. This means there’s a need for civil engineers and project planners who can oversee these large-scale projects."},{id:"track-2",title:"IELTS Listening: 6 Construction Job Openings Breakdown (Activity 26)",unit:"Unit 6",speaker:"Alex Johnson (Recruitment Consultant)",accent:"en-GB",description:"รายละเอียดตำแหน่งงานว่าง 6 ตำแหน่ง: Site Manager, Building Laborer, Safety Manager, Carpenter, Heavy Machinery Operator, Purchasing Coordinator",text:"Now, let’s take a look at some of the roles that we currently have available in the construction industry. First up, we have a site manager position. This is a permanent position that involves overseeing daily operations and ensuring the project stays on schedule. This is for a large global organization, so it requires travel to international project sites. The salary for this role is very high given the seniority of the position and the nature of the work. We also have an open position for building laborers. This is an entry-level position ideal for those wanting a first job in this industry. No formal qualifications are needed but applicants must provide details of previous employers who can vouch for their reliability and work ethic. For those with a background in workplace safety, there’s an opening for a safety manager. The project isn’t too big or complex, so this role is for three days a week and involves implementing and enforcing safety measures on site. There’s also a role available for a carpenter. This is a temporary role with a fixed end date. Since this job is based in a remote location, employees are based on site in dorms provided by the company. A certificate three in carpentry is required. Moving on, we have a vacancy for a heavy machinery operator. You need strong mechanical knowledge and at least two years of prior experience. Finally, we have a listing for a purchasing coordinator. A degree in business administration, finance or a related field is required."},{id:"track-3",title:"IELTS Speaking Part 2: Visit to Dharampur Village & Vaccination (Activity 27)",unit:"Unit 6",speaker:"Model IELTS Candidate",accent:"en-GB",description:"การพูดบรรยายตาม Cue Card: การไปเยือนหมู่บ้าน Dharampur, การพบคุณลุงนายแพทย์ John Simpson, และการช่วยกรอกแบบฟอร์มฉีดวัคซีนไข้ทรพิษ",text:"It is always a joyful time to go to my village as it gives me a much-needed break from the hustle and bustle of city life. Whenever I visit my village, it reminds me that this is where my roots are, and this is the place where I come from. My village Dharampur is a quiet little village that is nestled in the Aravalli hills. It’s a five-hour drive from my city. My uncle Dr. John Simpson lives there. He is the chief medical officer of a community health center there. Last summer, he invited us to spend our vacation at his house. My uncle has a huge ancestral house there. After a week, my uncle took me to his community health center. Our government is very determined to eradicate juvenile diseases such as smallpox and polio. When I went to the health center, I saw a long queue of village women who had brought their kids. My uncle asked me whether I would like to work as his assistant. He assigned me the task of filling up forms for the villagers as some of them were either illiterate or had difficulties in writing. This experience taught me a valuable lesson of selfless service. George Eliot rightly said that what do we live for, if not to make life less difficult for each other."},{id:"track-4",title:"TOEFL Listening: Student Loans & Work-Study Meeting (Activity 30)",unit:"Unit 7",speaker:"Female Student & Mr. Sanders (Advisor)",accent:"en-US",description:"บทสนทนาการขอสมัครโครงการ Work-Study เพื่อหาเงินผ่อนชำระหนี้กู้ยืมเรียน (Student Loans) และคำเตือนเรื่องเกรดเฉลี่ยทุนการศึกษา",text:"Student: Hi, Mr. Sanders. I was thinking that if I don’t start working towards paying off my student loans now, I’m going to feel really burdened and strapped for cash after graduation. So, I was hoping I would be able to join the work-study program and get a job on campus. Advisor: You’re a smart student. We can definitely sign you up for the work-study program. No problem. The jobs offered are only part-time, so you dedicate enough time to your studies. You can either apply for a job that requires 10 hours a week or 20 hours a week. I suggest you start with the 10 hours a week, so you don’t overload yourself. Student: Well, I think I’d rather work 20 hours a week. I mean, I want to make money faster and pay off my loans as quickly as possible. Advisor: Ah, it’s good that you’re thinking ahead, but considering you’re a freshman with a full class schedule, it wouldn’t be wise to increase your workload so much. If your grades slip up, you might not qualify again next year for your current scholarship. Student: Well, I really wouldn’t want that to happen. That would just put me into more debt. Okay, so what do you recommend? Advisor: I’m going to give you permission to work 10 hours a week. I’ll sign this form and then you will need to take it to the job center, and they will help you find a job reserved for work-study students."},{id:"track-5",title:"TOEFL Listening: Shakespeare Class Workload & TA Advice (Activity 31)",unit:"Unit 7",speaker:"Female Sophomore & TA John",accent:"en-US",description:"นักศึกษาปี 2 ขอคำแนะนำจาก TA John เรื่องภาระงานอ่านวิชา Shakespeare และคำแนะนำเรื่องสิทธิการดรอปวิชาใน 2 สัปดาห์แรก",text:"Student: Oh hey, John? You’re here for Professor Stanton’s Literature Class, right? I was actually wondering, you’re also the teaching assistant for Professor Stanton’s Shakespeare class next semester, right? I was thinking of taking that next semester. TA John: Aren’t you a freshman? You’ll have to wait until next year to sign up for the class. Student: No, I’m a sophomore actually, but I switched my major, which is why I’m just taking Professor Stanton’s Lit class this year. Anyway, I was wondering what you think about the class in terms of workload. Because I’ll be taking extra credits next semester, and I don’t want to feel overwhelmed, but I also really love Shakespeare. TA John: Well, in my opinion, the class is really fun, but it’s also a lot of work. You need to do a lot of reading, or you will quickly fall behind in class. Student: Hmm, yeah, it sounds like an awesome class, but I’m worried that I wouldn’t be able to make the most of it if I’m taking so many other classes. TA John: Well, you could always sign up and see how it goes the first two weeks. And if it seems like too much, you could drop the class and just take it next year when you have more time. Student: That’s a good idea! I forgot we had a couple of weeks to make changes to our schedule after the semester starts. Thanks for your help!"},{id:"track-6",title:"TOEFL Speaking Task 2: Elimination of Campus Sculpture Program (Activity 32)",unit:"Unit 7",speaker:"Announcement & Art Major Discussion",accent:"en-US",description:"ประกาศมหาวิทยาลัยเรื่องยกเลิกหลักสูตรประติมากรรม และการโต้แย้งของนักศึกษาศิลปะที่ชี้แจงว่างบประมาณแก้ได้ด้วยการจ้างอาจารย์พาร์ตไทม์",text:"Announcement: The university administration announced yesterday that the sculpture program will be eliminated. The main reason is a lack of student interest and low enrollment. Furthermore, the department’s only sculpture professor is retiring this year. Given the limited budget, hiring a new full-time professor is not justifiable. Student Discussion: As an art major, I think this is a huge loss for the department. The university has got it all wrong. The low enrollment isn’t because students lack interest in sculpture. The problem is that sculpture classes are optional electives, while mandatory painting and drawing courses consume all our time! What we really need is different degree requirements so art majors can explore sculpture. And regarding the budget, if money is the problem, they don’t need a costly full-time hire. They could hire a part-time professor or ask existing painting faculty who have secondary expertise in sculpture to teach the class!"},{id:"track-7",title:"TOEFL Speaking Task 4: Animal Tool Definitions (Narrow vs Broad) (Activity 33)",unit:"Unit 7",speaker:"Biology Professor",accent:"en-US",description:"การบรรยายชีววิทยาเรื่องคำนิยามของเครื่องมือ (Tool): นิยามแบบแคบ (ชิมแปนซีเหลากิ่งไม้) เทียบกับนิยามแบบกว้าง (ช้างหยิบกิ่งไม้มาเกาหลัง)",text:"Human beings are not the only animals that use tools. It is generally recognized that other animals use tools naturally in the wild without any human instruction. But when can we say that an object is a tool? Well, it depends on your definition, and in fact, there are two competing definitions. A narrow definition says that a tool is an object that is used to perform a specific task, but the object has got to be purposefully changed or shaped by the animal so that it can be used. For example, wild chimpanzees use sticks to dig insects out of their nests. But most sticks lying around won’t fit into the holes. So the chimps pull off the leaves, chew the stick, and trim it down until it is the right size. In this way, they intentionally adapt the object to their needs. The broad definition, on the other hand, says that an object does not have to be modified to be considered a tool. It is simply any object used to perform a specific task. For example, an elephant will pick up a fallen stick from the ground and scratch its back with it. The elephant uses it just as it is found without making any modifications. Under the broad definition, it is indeed a tool; but under the narrow definition, it is not."},{id:"track-8",title:"TOEIC Listening Part 1: Photographs - Business Meeting & Blueprints",unit:"Unit 8",speaker:"TOEIC Official Narrator",accent:"en-US",description:"ข้อสอบจำลอง TOEIC Part 1 การบรรยายภาพทีมวิศวกรและสถาปนิกกำลังตรวจดูพิมพ์เขียวบนโต๊ะประชุม",text:"Look at the photograph marked Number One in your test booklet. Choice A: They are painting the office walls. Choice B: They are reviewing architectural blueprints on the conference table. Choice C: They are packing luggage into the trunk of a car. Choice D: They are boarding an international flight at the departure gate."},{id:"track-9",title:"TOEIC Listening Part 2: Question-Response (When, Who, Indirect)",unit:"Unit 8",speaker:"TOEIC Test Speakers",accent:"en-US",description:"คำถาม-คำตอบสถานการณ์ทำงาน: กำหนดส่งรายงานการตลาด, ผู้รับผิดชอบจัดประชุมประจำปี, และสถานะการซ่อมเครื่องถ่ายเอกสาร",text:"Number One: When is the revised budget proposal due for the marketing campaign? Choice A: Yes, I enjoyed the seminar. Choice B: It has been extended until next Friday afternoon. Choice C: In the third-floor conference hall. Number Two: Who is responsible for organizing the annual regional conference this year? Choice A: Ms. Patterson from Human Resources is in charge of it. Choice B: Yes, the conference was very productive. Choice C: By express courier. Number Three: Has the technician repaired the color photocopier on the third floor yet? Choice A: He is still waiting for a replacement part to arrive from Bangkok. Choice B: Ten copies per minute, please. Choice C: No, I didn't see the painting."},{id:"track-10",title:"TOEIC Listening Part 3: Short Conversation (Shipment Weather Delay)",unit:"Unit 8",speaker:"Colleagues in Logistics",accent:"en-US",description:"บทสนทนาระหว่างเพื่อนร่วมงานเรื่องพัสดุชิปคอมพิวเตอร์ล่าช้าจากพายุฝน และการโทรศัพท์แจ้งเลื่อนนัดลูกค้า",text:"Man: Rachel, did you hear that the shipment of microchips from Singapore has been delayed due to severe thunderstorms? Woman: Oh no, our demonstration with the international clients is scheduled for tomorrow morning! What are we going to do? Man: Don’t worry, I will contact the client right away to explain the weather disruption and reschedule the presentation for Thursday afternoon. That should give customs enough time to clear the cargo."},{id:"track-11",title:"TOEIC Listening Part 4: Short Talk (Airport Gate Relocation)",unit:"Unit 8",speaker:"Airport Gate Announcer",accent:"en-US",description:"ประกาศจากท่าอากาศยานแจ้งผู้โดยสารเรื่องการเปลี่ยนประตูขึ้นเครื่องบินและกา nderground informal university called the "Floating University" while working for years as a governess to financially support her sister Bronya's medical studies in Paris, with the solemn promise that Bronya would later return the favor.`,thai:'มารี กูรี น่าจะเป็นนักวิทยาศาสตร์หญิงที่มีชื่อเสียงที่สุดตลอดกาล เกิดในชื่อ มาเรีย สโกลดอฟสกา ในกรุงวอร์ซอ ประเทศโปแลนด์ เมื่อปี 1867 เธอโดดเด่นตั้งแต่เด็กด้วยความจำที่ยอดเยี่ยมและความมุ่งมั่นอย่างแรงกล้าในการเรียนรู้ ในช่วงเวลานั้น โปแลนด์อยู่ภายใต้การปกครองกดขี่ของจักรวรรดิรัสเซีย และผู้หญิงถูกสั่งห้ามเข้าศึกษาในสถาบันอุดมศึกษาอย่างเด็ดขาด แต่มารีปฏิเสธที่จะละทิ้งความฝัน เธอแอบเข้าเรียนในมหาวิทยาลัยลับใต้ดินที่เรียกว่า "Floating University" พร้อมทั้งทำงานเป็นครูพี่เลี้ยงประจำบ้านอยู่หลายปีเพื่อส่งเสียค่าเล่าเรียนแพทย์ให้บรอนยาพี่สาวของเธอที่ปารีส โดยมีสัญญาใจว่าบรอนยาจะกลับมาส่งเสียมารีในภายหลัง',keyPoints:["เกิดที่กรุงวอร์ซอ ประเทศโปแลนด์ (1867) โดดเด่นเรื่องความจำและความขยัน",'ผู้หญิงในโปแลนด์ยุคนั้นถูกห้ามเรียนมหาวิทยาลัย จึงต้องเรียนใน "Floating University" ลับๆ',"ทำงานเป็นครูพี่เลี้ยง (governess) ส่งพี่สาวเรียนแพทย์ก่อน"]},{id:"B",label:"Paragraph B",title:"Arrival in Paris and Sorbonne University (1891)",text:"In 1891, this long-awaited promise was fulfilled. Marie arrived in Paris and enrolled at the prestigious Sorbonne University, where she immersed herself in physics and mathematics. Surviving in a freezing garret on a meager diet of bread, butter, and tea, her health occasionally faltered due to poverty and exhaustion. Despite these harsh deprivations, she graduated at the very top of her class in physics in 1893 and earned a second degree in mathematics the following year. It was during this intensely productive period that she met Pierre Curie, a brilliant French physicist whose shared devotion to scientific exploration led to their marriage in 1895.",thai:"ในปี 1891 สัญญาที่รอคอยมานานก็บรรลุผล มารีเดินทางถึงปารีสและลงทะเบียนเข้าศึกษา ณ มหาวิทยาลัยซอร์บอนน์อันทรงเกียรติ ที่ซึ่งเธอทุ่มเทให้แก่ฟิสิกส์และคณิตศาสตร์ เธออาศัยอยู่ในห้องใต้หลังคาอันหนาวเหน็บ ดำรงชีวิตด้วยอาหารประทังชีพเพียงขนมปัง เนย และชา จนสุขภาพทรุดโทรมจากความยากจนและความเหนื่อยล้า ทว่าแม้จะเผชิญความขาดแคลนแสนสาหัส เธอก็จบการศึกษาด้วยคะแนนอันดับ 1 ของรุ่นในสาขาฟิสิกส์ปี 1893 และคว้าปริญญาใบที่สองด้านคณิตศาสตร์ในปีถัดมา และในช่วงเวลานี้เองที่เธอได้พบกับ ปิแอร์ กูรี นักฟิสิกส์ชาวฝรั่งเศสผู้ปราดเปรื่อง ซึ่งความหลงใหลในวิทยาศาสตร์ร่วมกันได้นำไปสู่การแต่งงานในปี 1895",keyPoints:["ปี 1891 ย้ายไปเรียนที่ Sorbonne University กรุงปารีส","จบปริญญาตรีเกียรตินิยมอันดับ 1 สาขาฟิสิกส์ (1893) และได้ปริญญาคณิตศาสตร์ (1894)","พบรักและแต่งงานกับ Pierre Curie ในปี 1895"]},{id:"C",label:"Paragraph C",title:"The Breakthrough: Radioactivity, Polonium, and Radium",text:`Inspired by Henri Becquerel's discovery that uranium salts emitted mysterious rays, Marie chose to investigate uranium emissions for her doctoral research. Utilizing an electrometer constructed by Pierre and his brother Jacques, she discovered that the intensity of radiation was directly proportional to the amount of uranium present, unaffected by external chemical alterations. Hypothesizing that radiation was an atomic property rather than a molecular reaction, she coined the revolutionary term "radioactivity." Working laboriously in a poorly ventilated wooden shed, the Curies processed tons of pitchblende ore to isolate two previously unknown radioactive elements: polonium (named in honor of Marie's homeland) and radium, announced in 1898.`,thai:'ด้วยแรงบันดาลใจจากการค้นพบของ อองรี เบกเกอแรล ว่าเกลือยูเรเนียมปล่อยรังสีลึกลับออกมา มารีจึงเลือกศึกษาการแผ่รังสีของยูเรเนียมสำหรับงานวิจัยระดับปริญญาเอกของเธอ โดยใช้เครื่องอิเล็กโทรเมิเตอร์ที่ปิแอร์และชากพี่ชายประดิษฐ์ขึ้น เธอค้นพบว่าความเข้มของรังสีแปรผันตรงกับปริมาณของยูเรเนียม และไม่ได้รับผลกระทบจากการเปลี่ยนแปลงทางเคมีภายนอก เธอตั้งสมมติฐานว่าการแผ่รังสีเป็นคุณสมบัติในระดับอะตอม มิใช่ปฏิกิริยาระดับโมเลกุล และได้บัญญัติศัพท์ปฏิวัติวงการคือ "radioactivity" (กัมมันตภาพรังสี) สองสามีภรรยากูรีทำงานอย่างเหน็ดเหนื่อยในโรงเก็บไม้ที่ระบายอากาศไม่ดี เพื่อสกัดแร่พิตช์เบลนด์หลายตัน จนสามารถแยกธาตุกัมมันตรังสีที่ไม่เคยมีใครรู้จัก 2 ชนิด ได้แก่ พอโลเนียม (ตั้งชื่อเพื่อเป็นเกียรติแก่โปแลนด์บ้านเกิด) และ เรเดียม ในปี 1898',keyPoints:['บัญญัติคำว่า "radioactivity" (กัมมันตภาพรังสี)',"ค้นพบว่ารังสีเป็นคุณสมบัติระดับอะตอม (atomic property)","สกัดแร่ pitchblende หลายตันจนค้นพบ 2 ธาตุใหม่: Polonium (1898) และ Radium (1898)"]},{id:"D",label:"Paragraph D",title:"Double Nobel Laureate Honors",text:"The scientific magnitude of their research gained international acclaim. In 1903, Marie and Pierre Curie shared the Nobel Prize in Physics with Henri Becquerel, making Marie the first woman in history to win a Nobel Prize. Following Pierre's tragic death in a street carriage accident in 1906, Marie took over his professorship at the Sorbonne, becoming the university's first female professor. In 1911, she accomplished an unprecedented milestone by receiving her second Nobel Prize, this time as the sole winner in Chemistry for isolating pure metallic radium and studying its therapeutic properties, cementing her status as the only person to ever receive Nobel prizes in two separate scientific fields.",thai:"ความยิ่งใหญ่ทางวิทยาศาสตร์ของงานวิจัยทำให้ทั้งคู่ได้รับการยกย่องระดับนานาชาติ ในปี 1903 มารีและปิแอร์ กูรี ได้รับรางวัลโนเบลสาขาฟิสิกส์ร่วมกับอองรี เบกเกอแรล ส่งผลให้มารีเป็นสตรีคนแรกในประวัติศาสตร์ที่ได้รับรางวัลโนเบล ต่อมาหลังจากการเสียชีวิตอย่างกะทันหันของปิแอร์จากอุบัติเหตุรถม้าในปี 1906 มารีได้รับตำแหน่งศาสตราจารย์ต่อจากเขาที่ซอร์บอนน์ กลายเป็นศาสตราจารย์หญิงคนแรกของมหาวิทยาลัย และในปี 1911 เธอได้สร้างประวัติศาสตร์ที่ไม่มีใครเทียบได้ด้วยการคว้ารางวัลโนเบลครั้งที่สอง โดยคราวนี้เป็นผู้ชนะเดี่ยว (sole winner) ในสาขาเคมี จากการสกัดเรเดียมบริสุทธิ์และศึกษาคุณสมบัติการรักษาโรค ทำให้เธอกลายเป็นบุคคลเดียวในโลกที่ได้รางวัลโนเบลใน 2 สาขาวิทยาศาสตร์ที่แตกต่างกัน",keyPoints:["รางวัลโนเบลครั้งที่ 1 (ปี 1903): สาขาฟิสิกส์ ร่วมกับ Pierre Curie และ Henri Becquerel","กลายเป็นศาสตราจารย์หญิงคนแรกของมหาวิทยาลัยซอร์บอนน์ (1906)","รางวัลโนเบลครั้งที่ 2 (ปี 1911): สาขาเคมี ได้รับรางวัลคนเดียว (sole winner)"]},{id:"E",label:"Paragraph E",title:"Humanitarian Service in World War I",text:'During the outbreak of World War I in 1914, Marie recognized that wounded soldiers in battlefield trenches faced agonizing amputations or death because surgeons lacked diagnostic imaging. Demonstrating profound humanitarian altruism, she organized mobile X-ray vehicles, affectionately dubbed "Petites Curies" (Little Curies), and directed the installation of two hundred radiological units in field hospitals. Assisted by her teenage daughter Irène, she personally drove vehicles to the front lines, trained medical orderlies, and subjected herself to continuous high doses of radiation to save over one million soldiers.',thai:'เมื่อเกิดสงครามโลกครั้งที่ 1 ในปี 1914 มารีตระหนักว่าทหารบาดเจ็บในสนามรบต้องเผชิญกับการถูกตัดแขนขาหรือเสียชีวิตเพราะศัลยแพทย์ไม่มีเครื่องมือตรวจวินิจฉัย เธอจึงแสดงความเสียสละเพื่อมนุษยธรรมอย่างยิ่งยวด โดยจัดตั้งหน่วยเอกซเรย์เคลื่อนที่ซึ่งถูกขนานนามอย่างอบอุ่นว่า "Petites Curies" (กูรีน้อย) และควบคุมการติดตั้งห้องเอกซเรย์ 200 ยูนิตในโรงพยาบาลสนาม เธอพร้อมด้วย อิแรน บุตรสาววัยรุ่น ได้ขับรถไปยังแนวหน้าด้วยตนเอง ฝึกอบรมเจ้าหน้าที่แพทย์ และยอมสัมผัสกับรังสีปริมาณสูงอย่างต่อเนื่อง จนช่วยชีวิตทหารได้มากกว่าหนึ่งล้านคน',keyPoints:['บทบาทในสงครามโลกครั้งที่ 1 (1914): จัดตั้งรถเอกซเรย์เคลื่อนที่ "Petites Curies"',"ขับรถไปยังแนวหน้าร่วมกับบุตรสาว Irène ช่วยชีวิตทหารบาดเจ็บกว่า 1,000,000 คน"]},{id:"F",label:"Paragraph F",title:"Enduring Legacy and Sacrifice",text:"Marie Curie died in 1934 from aplastic anemia, an illness directly contracted from decades of prolonged, unshielded exposure to intense ionizing radiation. Throughout her illustrious career, she staunchly refused to patent her radium extraction process, believing that scientific progress belonged to all humanity without commercial gain. In 1995, her remains, alongside Pierre's, were solemnly transferred to the Panthéon in Paris, honoring her as the first woman buried there on her own merits. Her discoveries not only transformed modern physics and cancer therapy but also proved that brilliance knows no gender.",thai:"มารี กูรี เสียชีวิตในปี 1934 จากโรคโลหิตจางจากไขกระดูกฝ่อ (aplastic anemia) ซึ่งเป็นผลโดยตรงจากการสัมผัสรังสีเข้มข้นเป็นเวลานานหลายทศวรรษโดยไร้เครื่องกำบัง ตลอดอาชีพการงานอันทรงเกียรติ เธอปฏิเสธอย่างหนักแน่นที่จะจดสิทธิบัตรกระบวนการสกัดเรเดียม เพราะเชื่อว่าความก้าวหน้าทางวิทยาศาสตร์เป็นของมนุษยชาติทุกคนโดยไม่หวังผลกำไร ในปี 1995 ร่างของเธอและปิแอร์ได้รับการอัญเชิญไปฝัง ณ สุสานป็องเตอง (Panthéon) ในปารีส เพื่อเป็นเกียรติในฐานะสตรีคนแรกที่ได้ฝังที่นั่นด้วยเกียรติประวัติของตนเอง การค้นพบของเธอไม่เพียงปฏิวัติฟิสิกส์สมัยใหม่และการรักษามะเร็ง แต่ยังพิสูจน์ให้โลกเห็นว่าความอัจฉริยะไม่มีการแบ่งแยกเพศ",keyPoints:["เสียชีวิตปี 1934 จากโรคโลหิตจางจากไขกระดูกฝ่อ (aplastic anemia) จากการสัมผัสรังสี","ไม่ยอมจดสิทธิบัตรการสกัดเรเดียม เพราะต้องการให้วิทยาศาสตร์เป็นประโยชน์ต่อมวลมนุษยชาติ","สตรีคนแรกที่ได้รับการฝังใน Panthéon ในปารีสด้วยคุณงามความดีของตนเอง (1995)"]}],vocabGlossary:[{word:"pitchblende",pos:"noun",thai:"แร่พิตช์เบลนด์ (แร่ยูเรเนียมธรรมชาติที่อุดมด้วยกัมมันตรังสี)",context:"Processed tons of pitchblende ore to isolate polonium and radium."},{word:"radioactivity",pos:"noun",thai:"กัมมันตภาพรังสี (การแผ่รังสีของอะตอม)",context:'She coined the revolutionary term "radioactivity".'},{word:"sole winner",pos:"noun phrase",thai:"ผู้ชนะเดี่ยว (ได้รับรางวัลคนเดียวโดยไม่แชร์กับใคร)",context:"In 1911, she was the sole winner in Chemistry."},{word:"humanitarian",pos:"adjective",thai:"เพื่อมนุษยธรรม, มุ่งช่วยเหลือเพื่อนมนุษย์",context:"Demonstrating profound humanitarian altruism during WWI."},{word:"adversity",pos:"noun",thai:"ความยากลำบาก, อุปสรรคเคราะห์ร้าย",context:"She persevered in the face of intense financial adversity."},{word:"posthumous",pos:"adjective",thai:"เกิดขึ้นหลังการเสียชีวิต (มรณกรรม)",context:"Her posthumous honors included transfer to the Panthéon."}],questions:[{id:1,question:"According to Paragraph A, what was the primary reason Marie Curie could NOT enroll in a university in Poland as a young woman?",choices:["She failed the required entrance examinations in Warsaw.","Women were legally barred from attending institutions of higher education in Poland.","Her family refused to pay for her tuition fees.","The Russian Empire shut down all universities in Europe."],answer:1,paragraphRef:"A",explanation:'ในย่อหน้า A ระบุชัดเจนว่า "women were strictly barred from attending higher education institutions" (ผู้หญิงถูกสั่งห้ามเข้าศึกษาในสถาบันอุดมศึกษาอย่างเด็ดขาด) มารีจึงต้องแอบเรียนในมหาวิทยาลัยลับ Floating University'},{id:2,question:"Which of the following statements about Marie Curie's Nobel Prizes is TRUE?",choices:["She shared both of her Nobel Prizes equally with Pierre Curie.","She won the Nobel Prize in Physics as a sole winner in 1903.","She won the 1903 Physics prize jointly, but won the 1911 Chemistry prize as the sole winner.","She was awarded Nobel Prizes in Medicine and Chemistry."],answer:2,paragraphRef:"D",explanation:'ในย่อหน้า D ระบุว่า ในปี 1903 เธอได้รางวัลฟิสิกส์ร่วมกับ Pierre และ Becquerel แต่ในปี 1911 เธอได้รางวัลเคมีในฐานะ "the sole winner" (ผู้ชนะเพียงคนเดียว)'},{id:3,question:"What revolutionary scientific hypothesis did Marie Curie propose regarding radioactivity in Paragraph C?",choices:["Radiation was caused by sunlight heating uranium crystals.","Radiation was an atomic property rather than the result of molecular chemical interactions.","Pitchblende could only emit rays when mixed with heavy water.","Uranium was completely harmless to living organisms."],answer:1,paragraphRef:"C",explanation:`ย่อหน้า C ระบุว่า: "Hypothesizing that radiation was an atomic property rather than a molecular reaction, she coined the revolutionary term 'radioactivity'"`},{id:4,question:'The phrase "Petites Curies" in Paragraph E refers to:',choices:["Her two young daughters who served as nurses.","Miniature radium containers kept in research labs.","Mobile X-ray vehicles deployed to treat soldiers during World War I.","A series of published articles on mathematics."],answer:2,paragraphRef:"E",explanation:`ในย่อหน้า E ระบุว่า "Petites Curies" (กูรีน้อย) คือชื่อเรียกรถเอกซเรย์เคลื่อนที่ ("organized mobile X-ray vehicles, affectionately dubbed 'Petites Curies'") ที่ใช้ช่วยทหารบาดเจ็บในสงครามโลกครั้งที่ 1`},{id:5,question:"Why did Marie Curie refuse to patent the process of radium extraction (Paragraph F)?",choices:["She believed scientific discoveries belonged to humanity and should not be commercialized.","The French government refused her patent application.","Her husband Pierre had already patented the technique.","Patent laws did not exist in Europe during that era."],answer:0,paragraphRef:"F",explanation:'ในย่อหน้า F ระบุว่า: "she staunchly refused to patent her radium extraction process, believing that scientific progress belonged to all humanity without commercial gain."'},{id:6,question:'What is the closest meaning of the word "deprivations" in Paragraph B?',choices:["Luxuries and comforts","Academic achievements","Severe hardships and lack of basic necessities","Foreign travel opportunities"],answer:2,paragraphRef:"B",explanation:'คำว่า "deprivations" ในบริบทนี้แปลว่า ความขาดแคลนสิ่งจำเป็นในชีวิตหรือความยากลำบากแสนสาหัส (hardships/poverty)'}]},{id:"artisans",title:"From Artisans to Living Machines: Labor in the Industrial Age",thaiTitle:"จากช่างฝีมือสู่เครื่องจักรมีชีวิต: แรงงานในยุคปฏิวัติอุตสาหกรรม (Activity 29)",unit:"Unit 7",examType:"TOEFL Academic Reading (Activity 29)",readingTime:"5-6 นาที",wordCount:480,difficulty:"Advanced TOEFL",summary:"บทอ่านข้อสอบ TOEFL Activity 29 วิเคราะห์การเปลี่ยนแปลงวิถีชีวิตแรงงานอเมริกันก่อนและหลังปี 1815 จากช่างฝีมือผู้มีอิสรภาพในเวลา สู่ระบบโรงงานที่บังคับด้วยเสียงระฆังและนาฬิกาโรงงาน จนเกิดการต่อต้านและภาวะแปลกแยก",paragraphs:[{id:"1",label:"Paragraph 1",title:"The Pre-1815 Artisan Workshop Hierarchy",text:"Before 1815, manufacturing in the United States was largely characterized by a handicraft tradition conducted in small, personal workshops. Production was organized through an intimate hierarchy comprising master artisans, journeymen, and apprentices. Master craftsmen owned their shops, commanded tools of the trade, and shouldered the moral and vocational responsibility of training youth. Journeymen were paid day-laborers seeking to master their craft, while apprentices provided labor in exchange for food, lodging, and professional tutelage. Crucially, work was dictated not by strict temporal schedules, but by natural daylight, weather, and the individual pace of the artisan.",thai:"ก่อนปี 1815 ภาคการผลิตในสหรัฐอเมริกาขับเคลื่อนด้วยประเพณีงานช่างฝีมือในโรงงานขนาดเล็กที่เป็นกันเอง การผลิตจัดโครงสร้างตามลำดับชั้นอันใกล้ชิด ประกอบด้วย ช่างฝีมือชั้นครู (master artisans), ช่างชำนาญการ (journeymen) และเด็กฝึกงาน (apprentices) ครูช่างเป็นเจ้าของร้าน ควบคุมเครื่องมือ และแบกรับหน้าที่ในการขัดเกลาจริยธรรมและสอนวิชาชีพแก่เยาวชน ช่างชำนาญการคือลูกจ้างรายวันที่ต้องการฝึกฝนวิชาจนชำนาญ ส่วนเด็กฝึกงานจะทำงานแลกกับที่พัก อาหาร และการสั่งสอน และที่สำคัญที่สุด จังหวะการทำงานไม่ได้ถูกบังคับด้วยตารางเวลาอันเข้มงวด แต่ขึ้นอยู่กับแสงอาทิตย์ สภาพอากาศ และจังหวะชีวิตของช่างฝีมือเอง",keyPoints:["ก่อนปี 1815: ผลิตในโรงงานขนาดเล็ก มีระบบ 3 ระดับ: Master ➔ Journeymen ➔ Apprentices","ครูช่างคอยดูแลทั้งวิชาชีพและความประพฤติด้านศีลธรรม (moral responsibility)","เวลาทำงานยืดหยุ่น กำหนดตามแสงแดดธรรมชาติ ไม่ใช่นาฬิกา"]},{id:"2",label:"Paragraph 2",title:"The Industrial Transformation and Mechanization",text:"After 1815, this harmonious system was abruptly disrupted by the rapid emergence of mechanized textile mills and centralized factories. Capitalist merchants recognized that grouping workers under one roof and dividing production into repetitive, deskilled tasks dramatically increased output while slashing labor costs. Specialized artisans were replaced by semi-skilled machine operators who performed single, monotonous steps. Workers no longer owned the finished goods or tools; they simply sold their labor for hourly wages, diminishing their sense of pride and professional dignity.",thai:"หลังปี 1815 ระบบอันกลมเกลียวนี้ถูกทำลายลงอย่างกะทันหันด้วยการเกิดขึ้นของโรงงานทอผ้าพลังจักรกลและโรงงานรวมศูนย์ พ่อค้านายทุนตระหนักว่าการนำคนงานมารวมไว้ใต้หลังคาเดียวกันและแบ่งการผลิตออกเป็นขั้นตอนย่อยๆ ซ้ำๆ ที่ไม่ต้องใช้ทักษะสูง จะช่วยเพิ่มผลผลิตได้อย่างมหาศาลพร้อมทั้งตัดลดต้นทุนค่าแรง ช่างฝีมือผู้เชี่ยวชาญจึงถูกแทนที่ด้วยผู้ควบคุมเครื่องจักรที่ทำงานเพียงขั้นตอนเดียวซ้ำซาก คนงานไม่ได้เป็นเจ้าของเครื่องมือหรือสินค้าที่ทำเสร็จอีกต่อไป พวกเขาเพียงแค่ขายแรงงานแลกค่าจ้างรายชั่วโมง ซึ่งทำให้ความภาคภูมิใจและศักดิ์ศรีในวิชาชีพลดทอนลง",keyPoints:["หลังปี 1815: โรงงานอุตสาหกรรมเข้ามาแทนที่งานฝีมือ","แบ่งงานออกเป็นขั้นตอนซ้ำซาก (deskilling) เพื่อลดต้นทุน","คนงานกลายเป็นแค่ลูกจ้างรายชั่วโมง สูญเสียความเป็นเจ้าของเครื่องมือและผลงาน"]},{id:"3",label:"Paragraph 3",title:"The Tyranny of the Factory Clock",text:'The fundamental transformation lay in the imposition of artificial time discipline. In workshops, workers had routinely celebrated "Saint Monday"—a customary day of leisure, recuperation, or celebration after the weekend. In factories, however, the relentlessly chiming bell and the omnipresent factory clock reigned supreme. Workers were mandated to arrive precisely at dawn and endure twelve- to fourteen-hour shifts dictated by the steady rotation of waterwheels and steam engines. The factory clock emerged as an oppressive symbol of social control, policing every movement, meal, and restroom break.',thai:'ความเปลี่ยนแปลงขั้นพื้นฐานที่สุดคือการบังคับใช้ระเบียบวินัยเรื่องเวลาแบบเทียม ในอดีตโรงช่างฝีมือมักมีธรรมเนียมหยุดพักผ่อนในวันจันทร์ที่เรียกว่า "Saint Monday" เพื่อสังสรรค์หรือพักฟื้น ทว่าในโรงงานอุตสาหกรรม เสียงระฆังที่ดังไม่หยุดและนาฬิกาโรงงานที่แขวนอยู่ทุกที่กลายเป็นผู้มีอำนาจสูงสุด คนงานถูกบังคับให้มาถึงตรงเวลาตั้งแต่เช้าตรู่ และต้องทำงานกะละ 12 ถึง 14 ชั่วโมงตามรอบหมุนของกังหันน้ำและเครื่องจักรไอน้ำ นาฬิกาโรงงานจึงกลายเป็นสัญลักษณ์แห่งการกดขี่และการควบคุมทางสังคมที่คอยตรวจตราทุกฝีก้าว เวลาทานอาหาร และการเข้าห้องน้ำ',keyPoints:['โรงงานยกเลิกประเพณี "Saint Monday" (วันจันทร์พักผ่อนตามใจช่าง)','บังคับให้เข้างานตรงเวลาด้วย "เสียงระฆังและนาฬิกาโรงงาน" (factory clock)',"ทำงานยาวนาน 12-14 ชั่วโมงต่อวันตามจังหวะเครื่องจักร"]},{id:"4",label:"Paragraph 4",title:"Alienation, Absenteeism, and Resistance",text:'This dehumanizing regime bred profound psychological alienation. Skilled craftsmen lamented being degraded into mere "living machines" subordinated to mechanical contraptions. In response, workers resisted not merely by striking, but through pervasive covert defiance: persistent tardiness, unannounced absenteeism, and deliberate slowdowns. Employers retaliated with punitive fines and dismissals, lamenting that workers lacked industrious habits. This cultural conflict between capitalist productivity and human autonomy laid the groundwork for the early American labor union movement.',thai:'ระบอบที่ลดทอนความเป็นมนุษย์นี้ก่อให้เกิดความแปลกแยกทางจิตใจอย่างรุนแรง ช่างฝีมือผู้ชำนาญต่างตัดพ้อว่าตนเองถูกลดคุณค่าลงจนกลายเป็นเพียง "เครื่องจักรที่มีชีวิต" (living machines) ที่ต้องตกเป็นเบี้ยล่างของกลไกจักรกล ด้วยเหตุนี้ คนงานจึงตอบโต้ไม่ใช่แค่ด้วยการนัดหยุดงาน แต่ด้วยการขัดขืนอย่างเงียบๆ เช่น การมาสายเรื้อรัง การหยุดงานโดยไม่บอกกล่าว (absenteeism) และการแกล้งทำงานช้าลง นายจ้างจึงตอบโต้ด้วยการหักเงินค่าปรับและการไล่ออก ความขัดแย้งทางวัฒนธรรมระหว่างการแสวงหาผลผลิตของทุนนิยมกับอิสรภาพของมนุษย์นี้ ได้วางรากฐานให้แก่ขบวนการสหภาพแรงงานยุคแรกของอเมริกา',keyPoints:['คนงานรู้สึกแปลกแยก (alienation) และเปรียบตัวเองเป็น "living machines" (เครื่องจักรมีชีวิต)',"การต่อต้านอย่างเงียบๆ: มาสาย, โดดงาน (absenteeism), แกล้งทำงานช้าลง","เป็นจุดกำเนิดของสหภาพแรงงานอเมริกันยุคแรก"]}],vocabGlossary:[{word:"disrupted",pos:"verb",thai:"ถูกรบกวน, ถูกขัดขวางหรือทำลายลงอย่างกะทันหัน (= upset / interrupted)",context:"This system was abruptly disrupted by mechanized mills."},{word:"artisan",pos:"noun",thai:"ช่างฝีมือ, ช่างประดิษฐ์งานศิลปหัตถกรรม",context:"Manufacturing was conducted by master artisans and apprentices."},{word:"journeyman",pos:"noun",thai:"ช่างผู้ผ่านการฝึกงานแล้วแต่ยังไม่ใช่ครูช่าง (รับจ้างรายวัน)",context:"Journeymen were paid day-laborers seeking to master their craft."},{word:"absenteeism",pos:"noun",thai:"การขาดงานบ่อยๆ โดยไม่มีเหตุผลอันควร",context:"Workers resisted through persistent tardiness and unannounced absenteeism."},{word:"alienation",pos:"noun",thai:"ความรู้สึกแปลกแยก, การตัดขาดจากสังคมหรือตนเอง",context:"This dehumanizing regime bred profound psychological alienation."},{word:"living machines",pos:"noun phrase",thai:"เครื่องจักรที่มีชีวิต (คำอุปมาเปรียบคนงานที่ไร้อิสรภาพ)",context:"Craftsmen lamented being degraded into mere living machines."}],questions:[{id:1,question:"According to Paragraph 1, which of the following is NOT a feature of manufacturing before 1815?",choices:["Work was performed in small, personal workshops.","Pacing was determined by natural conditions such as daylight.","Workers were strictly penalized by factory clocks and bells.","Master craftsmen supervised the moral and vocational growth of apprentices."],answer:2,paragraphRef:"1",explanation:"ก่อนปี 1815 ไม่มีการใช้ factory clock และเสียงระฆังกดดันคนงาน ข้อ 2 จึงเป็นสิ่งที่ไม่ถูกต้องสำหรับยุคก่อน 1815 (การบังคับด้วยนาฬิกาเกิดขึ้นหลังปี 1815)"},{id:2,question:'The word "disrupted" in Paragraph 2 is closest in meaning to:',choices:["improved","upset or interrupted","financed","celebrated"],answer:1,paragraphRef:"2",explanation:'คำว่า "disrupted" ในข้อสอบ TOEFL Activity 29 มีความหมายตรงกับ "upset / interrupted" (ถูกรบกวน ขัดขวาง หรือทำให้หยุดชะงักลง)'},{id:3,question:'What was "Saint Monday" as described in Paragraph 3?',choices:["A mandatory religious holiday enforced by factory owners.","A customary day of leisure observed by traditional workshop craftsmen.","The first day of the fiscal quarter when wages were paid.","A day when apprentices graduated to become master artisans."],answer:1,paragraphRef:"3",explanation:'ย่อหน้า 3 ระบุว่า "Saint Monday" คือธรรมเนียมของช่างฝีมือดั้งเดิมที่ใช้เป็นวันพักผ่อน ฟื้นฟูร่างกาย หรือสังสรรค์หลังสุดสัปดาห์ ("a customary day of leisure, recuperation, or celebration")'},{id:4,question:"Why did factory owners divide production into small, repetitive steps (Paragraph 2)?",choices:["To ensure all workers became master craftsmen.","To maximize output while drastically cutting labor expenses.","To comply with government labor regulations.","To protect workers from hazardous machinery."],answer:1,paragraphRef:"2",explanation:'ย่อหน้า 2 ระบุว่า: "dividing production into repetitive, deskilled tasks dramatically increased output while slashing labor costs."'},{id:5,question:'The metaphor "living machines" in Paragraph 4 implies that workers felt:',choices:["Empowered and wealthy from mechanized industry.","Healthy and energetic like newly built engines.","Dehumanized, stripped of autonomy, and controlled by mechanical schedules.","Eager to invent new technological apparatuses."],answer:2,paragraphRef:"4",explanation:'คำอุปมา "living machines" หมายถึงความรู้สึกที่คนงานถูกลดคุณค่าความเป็นมนุษย์ สูญเสียอิสรภาพ และต้องทำงานเหมือนเป็นชิ้นส่วนเครื่องจักร'},{id:6,question:"How did workers covertly resist factory working conditions according to Paragraph 4?",choices:["By destroying the steam engines and waterwheels entirely.","Through absenteeism, chronic lateness, and intentional work slowdowns.","By forming political parties to ban all factories.","By migrating back to European nations."],answer:1,paragraphRef:"4",explanation:'ในย่อหน้า 4 ระบุว่าคนงานต่อต้านอย่างเงียบๆ ด้วย: "pervasive covert defiance: persistent tardiness, unannounced absenteeism, and deliberate slowdowns."'}]},{id:"toeic-logistics",title:"OmniLogistics Supply Chain Notice & Warranty Claim",thaiTitle:"ใบส่งของผิดพลาดและการเคลมประกันสินค้า TOEIC Part 7",unit:"Unit 8",examType:"TOEIC Part 7 Double Passage",readingTime:"4-5 นาที",wordCount:390,difficulty:"Intermedi ผู้ประสานงานฝ่ายจัดซื้ออาวุโส, บริษัท ฮอไรซอน เทค โซลูชั่นส์`,keyPoints:["ของขาด: ได้รับ TX-400 แค่ 35 ชิ้น (ขาดไป 15 ชิ้น)","ของพัง: PDU-8 เสียหายระหว่างขนส่ง 5 ชิ้น","ข้อเรียกร้อง: ให้ส่งของที่ขาดและของเปลี่ยนทดแทนมาด่วน หรือ คืนเงินชดเชย $2,675.00"]}],vocabGlossary:[{word:"invoice",pos:"noun",thai:"ใบแจ้งหนี้, ใบเรียกเก็บเงิน",context:"Consignment delivered under Invoice #INV-8492."},{word:"discrepancy",pos:"noun",thai:"ความคลาดเคลื่อน, ความไม่ตรงกันของจำนวนหรือข้อมูล",context:"We uncovered two major discrepancies in the shipment."},{word:"reimburse",pos:"verb",thai:"ชำระเงินคืน, ชดเชยค่าใช้จ่าย",context:"Please reimburse our corporate account $2,675.00."},{word:"consignment",pos:"noun",thai:"สินค้าที่ส่งมอบ, พัสดุล็อตการขนส่ง",context:"Alert you regarding our consignment delivered earlier."},{word:"defective",pos:"adjective",thai:"มีตำหนิ, ชำรุดบกพร่อง",context:"Five of the rackmount units were found to be defective and unusable."}],questions:[{id:1,question:"What is the purpose of Mr. Patel's email in Document 2?",choices:["To place a brand-new order for Cat-7 cables.","To report missing items and request replacements for damaged merchandise.","To apply for a vacant job position in Seattle.","To negotiate a reduction in sales tax rate."],answer:1,paragraphRef:"DOC2",explanation:"อีเมลของ Mr. Patel มีจุดประสงค์เพื่อแจ้งปัญหาสินค้าที่ขาดส่ง (15 ชิ้น) และสินค้าที่ชำรุดเสียหายระหว่างขนส่ง (5 ชิ้น) พร้อมทั้งขอเคลมสินค้าทดแทนหรือเงินคืน"},{id:2,question:"According to both documents, how many units of Model TX-400 did Horizon Tech actually receive?",choices:["50 units","35 units","15 units","20 units"],answer:1,paragraphRef:"DOC2",explanation:'ใน Document 2 ระบุชัดเจนว่า "We only received 35 units of the Industrial Fiber-Optic Transceivers (Model TX-400)" แม้ในบิลจะระบุ 50 ชิ้นก็ตาม'},{id:3,question:"How did Mr. Patel calculate the suggested reimbursement amount of $2,675.00?",choices:["By subtracting the courier freight cost from the subtotal.","By multiplying 15 missing transceivers ($120 each) and 5 damaged PDUs ($175 each).","By calculating 5% of the total invoice balance.","By refunding the 100 rolls of Cat-7 cables."],answer:1,paragraphRef:"DOC1",explanation:"คำนวณจาก: ตัวรับส่งสัญญาณที่ขาด 15 ชิ้น x $120 = $1,800 + รางปลั๊กไฟ PDU ที่พัง 5 ชิ้น x $175 = $875 รวมกันได้ $2,675 พอดี"},{id:4,question:"What warranty policy was specified on Invoice #INV-8492?",choices:["No refunds or warranty under any circumstances.","A 30-day money-back guarantee.","A standard 2-year manufacturer warranty on hardware components.","A lifetime replacement policy."],answer:2,paragraphRef:"DOC1",explanation:'ใน Document 1 ระบุว่า: "Terms: Net 30 Days | Standard 2-Year Manufacturer Warranty Applies to all hardware components."'},{id:5,question:'The word "discrepancies" in Document 2 is closest in meaning to:',choices:["inconsistencies or differences","discounts","compliments","advertisements"],answer:0,paragraphRef:"DOC2",explanation:'คำว่า "discrepancies" หมายถึง ข้อแตกต่าง ความคลาดเคลื่อน หรือความไม่ตรงกันระหว่างสิ่งที่ควรจะเป็นกับสิ่งที่ได้รับจริง (inconsistencies/differences)'}]},{id:"academic-policy",title:"University Degree Classification & Academic Standing Guidelines",thaiTitle:"ระเบียบการจัดระดับปริญญาและสถานะภาพทางวิชาการ (Unit 5)",unit:"Unit 5",examType:"Higher Education Academic Handbook",readingTime:"4-5 นาที",wordCount:420,difficulty:"Intermediate Academic",summary:"ข้อบังคับมหาวิทยาลัยเกี่ยวกับโครงสร้างหน่วยกิต ระดับปริญญา (Associate, Bachelor, Master, Doctorate) เงื่อนไขการติดทัณฑ์บนทางวิชาการ (Academic Probation) และข้อกำหนดวิชาบังคับก่อน (Prerequisite)",paragraphs:[{id:"SEC1",label:"Section 1",title:"Degree Framework and Credit Requirements",text:"The university recognizes four principal tiers of academic degrees. The Associate Degree requires a minimum of 60 semester credit hours, typically completed over two years at a community college or technical institute. The Bachelor's Degree (Baccalaureate) mandates at least 120 credit hours, encompassing general education breadth courses, major concentration requirements, and elective electives. Graduate education encompasses the Master's Degree (30–36 credits beyond the baccalaureate, culminating in a thesis or comprehensive examination) and Doctoral Degrees (Ph.D. or Ed.D.), which demand original dissertation research, defense before a faculty panel, and sustained scholarship.",thai:"มหาวิทยาลัยกำหนดโครงสร้างปริญญาทางวิชาการออกเป็น 4 ระดับหลัก ได้แก่ ปริญญาอนุปริญญา (Associate Degree) กำหนดจำนวนหน่วยกิตไม่น้อยกว่า 60 หน่วยกิต โดยทั่วไปใช้เวลาเรียน 2 ปีในวิทยาลัยชุมชน ปริญญาตรี (Bachelor's Degree) กำหนดไม่น้อยกว่า 120 หน่วยกิต ครอบคลุมวิชาศึกษาทั่วไป วิชาเอกบังคับ และวิชาเลือกเสรี สำหรับระดับบัณฑิตศึกษาประกอบด้วย ปริญญาโท (Master's Degree กำหนด 30-36 หน่วยกิตต่อจากปริญญาตรีและทำวิทยานิพนธ์) และปริญญาเอก (Doctoral Degrees: Ph.D.) ซึ่งต้องทำงานวิจัยดุษฎีนิพนธ์ที่เป็นต้นฉบับและสอบป้องกันต่อหน้าคณะกรรมการผู้ทรงคุณวุฒิ",keyPoints:["Associate: 60 หน่วยกิต (2 ปี)","Bachelor: 120 หน่วยกิต (4 ปี)","Master: 30-36 หน่วยกิต (ต้องทำ thesis)","Doctorate (Ph.D.): ต้องทำวิจัยดุษฎีนิพนธ์ (dissertation) และสอบป้องกัน"]},{id:"SEC2",label:"Section 2",title:"Academic Standing and Probation Policies",text:"All undergraduate candidates are expected to maintain Good Academic Standing with a cumulative Grade Point Average (GPA) of 2.00 or higher on a 4.00 scale. If an undergraduate student's cumulative GPA drops below 2.00 at the conclusion of any academic term, the student is automatically placed on Academic Probation for the subsequent semester. During probation, the student is restricted to a maximum course load of 13 credit hours and is ineligible to participate in intercollegiate athletics or hold executive office in registered student organizations. If the student fails to raise their cumulative GPA to 2.00 by the end of two consecutive probationary terms, the student is subject to formal Academic Dismissal.",thai:'นักศึกษาระดับปริญญาตรีทุกคนต้องรักษาสถานภาพทางวิชาการที่ดี (Good Academic Standing) ด้วยเกรดเฉลี่ยสะสม (GPA) ไม่ต่ำกว่า 2.00 จากระบบ 4.00 หากเกรดเฉลี่ยสะสมลดลงต่ำกว่า 2.00 เมื่อสิ้นสุดภาคการศึกษาใด นักศึกษาจะถูกจัดให้อยู่ในสถานะ "ทัณฑ์บนทางวิชาการ" (Academic Probation) โดยอัตโนมัติในภาคการศึกษาถัดไป ในช่วงทัณฑ์บน นักศึกษาจะถูกจำกัดให้ลงทะเบียนเรียนได้สูงสุดไม่เกิน 13 หน่วยกิต และถูกตัดสิทธิ์จากการแข่งขันกีฬาหรือการดำรงตำแหน่งผู้บริหารในชมรม หากไม่สามารถทำเกรดเฉลี่ยสะสมให้ถึง 2.00 ได้ภายใน 2 ภาคการศึกษาติดต่อกัน จะถูกสั่ง "พ้นสภาพนักศึกษา" (Academic Dismissal)',keyPoints:["เกรดเฉลี่ยปกติ: ไม่ต่ำกว่า 2.00","หากต่ำกว่า 2.00: ติดทัณฑ์บน (Academic Probation) ลงทะเบียนได้สูงสุด 13 หน่วยกิต","หากไม่สามารถแก้เกรดได้ใน 2 เทอมติด: พ้นสภาพนักศึกษา (Academic Dismissal)"]},{id:"SEC3",label:"Section 3",title:"Prerequisite Course Policy and Waivers",text:"A prerequisite course is an introductory or foundational class that must be successfully completed with a passing grade (C or better) prior to enrolling in an advanced, upper-division course. Under no circumstances may a student register for both a prerequisite and its subsequent sequential course concurrently. Prerequisite waivers may only be granted under extraordinary circumstances upon written approval from the department chair and the course instructor, provided the student demonstrates equivalent mastery through standardized testing or prior accredited coursework.",thai:"วิชาบังคับก่อน (Prerequisite course) คือวิชาพื้นฐานที่นักศึกษาต้องสอบผ่านด้วยเกรด C ขึ้นไปก่อน จึงจะสามารถลงทะเบียนเรียนวิชาขั้นสูงที่ต่อเนื่องกันได้ ไม่ว่ากรณีใดๆ นักศึกษาไม่สามารถลงทะเบียนเรียนวิชาบังคับก่อนและวิชาต่อเนื่องพร้อมกันในเทอมเดียวกัน การขอยกเว้นวิชาบังคับก่อนจะทำได้เฉพาะกรณีพิเศษโดยต้องได้รับการอนุมัติเป็นลายลักษณ์อักษรจากหัวหน้าภาควิชาและอาจารย์ผู้สอนเท่านั้น",keyPoints:["Prerequisite: ต้องเรียนผ่านด้วยเกรด C ขึ้นไปก่อนลงวิชาถัดไป","ห้ามลงเรียนวิชาบังคับก่อนควบคู่กับวิชาต่อเนื่องในเทอมเดียวกัน"]}],vocabGlossary:[{word:"curriculum",pos:"noun",thai:"หลักสูตรการศึกษา",context:"Encompassing the broader general education curriculum."},{word:"probation",pos:"noun",thai:"การติดทัณฑ์บนทางวิชาการ (เมื่อเกรดตกต่ำกว่าเกณฑ์)",context:"Automatically placed on Academic Probation."},{word:"prerequisite",pos:"noun",thai:"วิชาบังคับก่อน (ต้องผ่านก่อนลงวิชาถัดไป)",context:"A prerequisite course must be completed with a C or better."},{word:"dissertation",pos:"noun",thai:"ดุษฎีนิพนธ์ (วิทยานิพนธ์ระดับปริญญาเอก)",context:"Doctoral degrees demand original dissertation research."},{word:"matriculate",pos:"verb",thai:"ขึ้นทะเบียนเข้าเป็นนักศึกษาอย่างเป็นทางการ",context:"Students must matriculate before enrolling in major courses."}],questions:[{id:1,question:"According to Section 1, how many credit hours are typically required for an Associate Degree compared to a Bachelor's Degree?",choices:["30 credits for Associate; 60 credits for Bachelor's","60 credits for Associate; 120 credits for Bachelor's","120 credits for Associate; 180 credits for Bachelor's","60 credits for Associate; 90 credits for Bachelor's"],answer:1,paragraphRef:"SEC1",explanation:"Section 1 ระบุว่า Associate Degree ต้องการ 60 หน่วยกิต และ Bachelor's Degree ต้องการอย่างน้อย 120 หน่วยกิต"},{id:2,question:"What happens immediately when an undergraduate student's cumulative GPA drops below 2.00 at the end of a semester?",choices:["The student is expelled immediately from the university.","The student is automatically placed on Academic Probation.","The student must forfeit all earned credit hours.","The student is transferred to an Associate degree program."],answer:1,paragraphRef:"SEC2",explanation:'ใน Section 2 ระบุว่า หาก GPA ต่ำกว่า 2.00 จะถูกจัดให้อยู่ในสถานะ "Academic Probation" (ทัณฑ์บนทางวิชาการ) โดยอัตโนมัติในเทอมถัดไป'},{id:3,question:"Which of the following restrictions applies to an undergraduate student on Academic Probation?",choices:["They cannot take more than 13 credit hours and cannot participate in varsity athletics.","They are not allowed to enter the campus library.","They must take at least 18 credit hours to improve their GPA faster.","They cannot change their declared major."],answer:0,paragraphRef:"SEC2",explanation:"Section 2 ระบุว่า นักศึกษาที่ติดทัณฑ์บนจะถูกจำกัดการลงทะเบียนเรียนได้สูงสุดไม่เกิน 13 หน่วยกิต และห้ามเข้าร่วมการแข่งขันกีฬา intercollegiate athletics"},{id:4,question:"Can a student take a prerequisite course and its advanced subsequent course in the same term?",choices:["Yes, as long as they pay double tuition.","Yes, if they are in their final senior semester.","No, under no circumstances may both courses be taken concurrently.","Yes, if the course is taught online."],answer:2,paragraphRef:"SEC3",explanation:'Section 3 ระบุชัดเจนว่า: "Under no circumstances may a student register for both a prerequisite and its subsequent sequential course concurrently."'}]},{id:"toefl-speaking-reading",title:"University Dining & Eco-Packaging Policy Notice",thaiTitle:"ประกาศนโยบายบรรจุภัณฑ์และโรงอาหารมหาวิทยาลัย (TOEFL Speaking Task 2 Reading)",unit:"Unit 7",examType:"TOEFL Integrated Reading (Speaking Task 2 Passage)",readingTime:"3-4 นาที",wordCount:260,difficulty:"Intermediate Academic",summary:"ข้อสอบประเภท TOEFL Integrated Reading ที่มักเป็นประกาศของมหาวิทยาลัย แจ้งยกเลิกการใช้พลาสติกแบบใช้ครั้งเดียวทิ้งในโรงอาหาร และปรับค่ามัดจำกล่องอาหารรักษ์โลก",paragraphs:[{id:"MEMO",label:"Administrative Announcement",title:"Transition to Reusable Dining Containers (Effective Nov 1)",text:`MEMORANDUM
To: University Campus Community
From: Office of Auxiliary Services & Environmental Sustainability Taskforce
Date: October 18, 2026
Subject: Elimination of Single-Use Plastics Across All Campus Dining Halls

In accordance with the university's Strategic Climate Action Commitment, all campus dining facilities—including the Central Commons, West Campus Food Court, and student cafes—will completely eliminate disposable styrofoam and single-use plastic takeout containers beginning November 1.

To facilitate this green transition, the university is launching the "GreenBox" initiative. All residential students will be issued a complimentary reusable, BPA-free meal container during the first week of implementation. When ordering takeout, students will present their clean GreenBox to dining staff, or exchange a used one for a sanitized replacement. Non-residential students and faculty may purchase a GreenBox for a one-time refundable deposit of $5.00.

By adopting this system, the campus community is projected to divert approximately 45 tons of plastic waste from municipal landfills each academic year while cutting carbon emissions from packaging production.`,thai:`บันทึกข้อความ
ถึง: ประชาคมชาวมหาวิทยาลัย
จาก: สำนักงานบริการเสริมและคณะทำงานด้านความยั่งยืนทางสิ่งแวดล้อม
วันที่: 18 ตุลาคม 2026
หัวข้อ: การยกเลิกพลาสติกแบบใช้ครั้งเดียวทิ้งในโรงอาหารทุกแห่งในวิทยาเขต

เพื่อให้สอดคล้องกับพันธสัญญาด้านการจัดการสภาพภูมิอากาศของมหาวิทยาลัย โรงอาหารทุกแห่งในวิทยาเขต รวมถึง Central Commons, ศูนย์อาหารฝั่งตะวันตก และคาเฟ่นักศึกษา จะยกเลิกการใช้กล่องโฟมและบรรจุภัณฑ์พลาสติกแบบใช้ครั้งเดียวทิ้งทั้งหมด โดยมีผลตั้งแต่วันที่ 1 พฤศจิกายน เป็นต้นไป

เพื่อสนับสนุนการเปลี่ยนแปลงที่เป็นมิตรต่อสิ่งแวดล้อมนี้ มหาวิทยาลัยขอเปิดตัวโครงการ "GreenBox" โดยนักศึกษาหอพักทุกคนจะได้รับกล่องอาหารแบบใช้ซ้ำได้ ปลอดสาร BPA ฟรี 1 ใบในสัปดาห์แรก เมื่อสั่งอาหารกลับบ้าน นักศึกษาเพียงยื่นกล่อง GreenBox ที่สะอาด หรือนำกล่องที่ใช้แล้วมาแลกกล่องที่ผ่านการฆ่าเชื้อแล้ว ส่วนนักศึกษาไป-กลับและบุคลากรสามารถเข้าร่วมโครงการได้ด้วยการวางเงินมัดจำเพียง $5.00 ซึ่งขอรับคืนได้
