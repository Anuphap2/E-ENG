ลกัน / BCC ซ่อนอีเมลผู้รับเพื่อความเป็นส่วนตัว"]})]})]})]})]})]})}const Fd=[{id:"track-1",title:"IELTS Listening: BuildRight Recruitment & Sector Trends (Activity 25)",unit:"Unit 6",speaker:"Alex Johnson (Recruitment Consultant)",accent:"en-GB",description:"บทบรรยายแนะนำภาคอุตสาหกรรมก่อสร้าง ความต้องการอาคารประหยัดพลังงาน (green tech) และการลงทุนโครงสร้างพื้นฐานของรัฐบาล",text:"Hello, everyone. My name is Alex Johnson and I’m a recruitment consultant at BuildRight Recruitment. We’re an agency that specializes in providing staff for the construction industry. Now I understand that you’re all final year students in the School of Engineering and you’re interested in working in construction. So, I’d like to talk to you today about some of the opportunities available and the skills you’ll need to succeed in this sector. Construction is a diverse field which involves the building of many different types of premises. Of course, the main two types of premises are residential properties and commercial properties. At the moment, we’re seeing increasing demand for properties that are built using energy efficient materials and green technologies to keep up with tightening regulations. Supply depots and storage facilities are another type of construction that you could be involved in depending on your job. Also, governments worldwide are investing heavily in updating and expanding infrastructure leading to a surge in projects related to roads, bridges, and bus, and rail networks. This means there’s a need for civil engineers and project planners who can oversee these large-scale projects."},{id:"track-2",title:"IELTS Listening: 6 Construction Job Openings Breakdown (Activity 26)",unit:"Unit 6",speaker:"Alex Johnson (Recruitment Consultant)",accent:"en-GB",description:"รายละเอียดตำแหน่งงานว่าง 6 ตำแหน่ง: Site Manager, Building Laborer, Safety Manager, Carpenter, Heavy Machinery Operator, Purchasing Coordinator",text:"Now, let’s take a look at some of the roles that we currently have available in the construction industry. First up, we have a site manager position. This is a permanent position that involves overseeing daily operations and ensuring the project stays on schedule. This is for a large global organization, so it requires travel to international project sites. The salary for this role is very high given the seniority of the position and the nature of the work. We also have an open position for building laborers. This is an entry-level position ideal for those wanting a first job in this industry. No formal qualifications are needed but applicants must provide details of previous employers who can vouch for their reliability and work ethic. For those with a background in workplace safety, there’s an opening for a safety manager. The project isn’t too big or complex, so this role is for three days a week and involves implementing and enforcing safety measures on site. There’s also a role available for a carpenter. This is a temporary role with a fixed end date. Since this job is based in a remote location, employees are based on site in dorms provided by the company. A certificate three in carpentry is required. Moving on, we have a vacancy for a heavy machinery operator. You need strong mechanical knowledge and at least two years of prior experience. Finally, we have a listing for a purchasing coordinator. A degree in business administration, finance or a related field is required."},{id:"track-3",title:"IELTS Speaking Part 2: Visit to Dharampur Village & Vaccination (Activity 27)",unit:"Unit 6",speaker:"Model IELTS Candidate",accent:"en-GB",description:"การพูดบรรยายตาม Cue Card: การไปเยือนหมู่บ้าน Dharampur, การพบคุณลุงนายแพทย์ John Simpson, และการช่วยกรอกแบบฟอร์มฉีดวัคซีนไข้ทรพิษ",text:"It is always a joyful time to go to my village as it gives me a much-needed break from the hustle and bustle of city life. Whenever I visit my village, it reminds me that this is where my roots are, and this is the place where I come from. My village Dharampur is a quiet little village that is nestled in the Aravalli hills. It’s a five-hour drive from my city. My uncle Dr. John Simpson lives there. He is the chief medical officer of a community health center there. Last summer, he invited us to spend our vacation at his house. My uncle has a huge ancestral house there. After a week, my uncle took me to his community health center. Our government is very determined to eradicate juvenile diseases such as smallpox and polio. When I went to the health center, I saw a long queue of village women who had brought their kids. My uncle asked me whether I would like to work as his assistant. He assigned me the task of filling up forms for the villagers as some of them were either illiterate or had difficulties in writing. This experience taught me a valuable lesson of selfless service. George Eliot rightly said that what do we live for, if not to make life less difficult for each other."},{id:"track-4",title:"TOEFL Listening: Student Loans & Work-Study Meeting (Activity 30)",unit:"Unit 7",speaker:"Female Student & Mr. Sanders (Advisor)",accent:"en-US",description:"บทสนทนาการขอสมัครโครงการ Work-Study เพื่อหาเงินผ่อนชำระหนี้กู้ยืมเรียน (Student Loans) และคำเตือนเรื่องเกรดเฉลี่ยทุนการศึกษา",text:"Student: Hi, Mr. Sanders. I was thinking that if I don’t start working towards paying off my student loans now, I’m going to feel really burdened and strapped for cash after graduation. So, I was hoping I would be able to join the work-study program and get a job on campus. Advisor: You’re a smart student. We can definitely sign you up for the work-study program. No problem. The jobs offered are only part-time, so you dedicate enough time to your studies. You can either apply for a job that requires 10 hours a week or 20 hours a week. I suggest you start with the 10 hours a week, so you don’t overload yourself. Student: Well, I think I’d rather work 20 hours a week. I mean, I want to make money faster and pay off my loans as quickly as possible. Advisor: Ah, it’s good that you’re thinking ahead, but considering you’re a freshman with a full class schedule, it wouldn’t be wise to increase your workload so much. If your grades slip up, you might not qualify again next year for your current scholarship. Student: Well, I really wouldn’t want that to happen. That would just put me into more debt. Okay, so what do you recommend? Advisor: I’m going to give you permission to work 10 hours a week. I’ll sign this form and then you will need to take it to the job center, and they will help you find a job reserved for work-study students."},{id:"track-5",title:"TOEFL Listening: Shakespeare Class Workload & TA Advice (Activity 31)",unit:"Unit 7",speaker:"Female Sophomore & TA John",accent:"en-US",description:"นักศึกษาปี 2 ขอคำแนะนำจาก TA John เรื่องภาระงานอ่านวิชา Shakespeare และคำแนะนำเรื่องสิทธิการดรอปวิชาใน 2 สัปดาห์แรก",text:"Student: Oh hey, John? You’re here for Professor Stanton’s Literature Class, right? I was actually wondering, you’re also the teaching assistant for Professor Stanton’s Shakespeare class next semester, right? I was thinking of taking that next semester. TA John: Aren’t you a freshman? You’ll have to wait until next year to sign up for the class. Student: No, I’m a sophomore actually, but I switched my major, which is why I’m just taking Professor Stanton’s Lit class this year. Anyway, I was wondering what you think about the class in terms of workload. Because I’ll be taking extra credits next semester, and I don’t want to feel overwhelmed, but I also really love Shakespeare. TA John: Well, in my opinion, the class is really fun, but it’s also a lot of work. You need to do a lot of reading, or you will quickly fall behind in class. Student: Hmm, yeah, it sounds like an awesome class, but I’m worried that I wouldn’t be able to make the most of it if I’m taking so many other classes. TA John: Well, you could always sign up and see how it goes the first two weeks. And if it seems like too much, you could drop the class and just take it next year when you have more time. Student: That’s a good idea! I forgot we had a couple of weeks to make changes to our schedule after the semester starts. Thanks for your help!"},{id:"track-6",title:"TOEFL Speaking Task 2: Elimination of Campus Sculpture Program (Activity 32)",unit:"Unit 7",speaker:"Announcement & Art Major Discussion",accent:"en-US",description:"ประกาศมหาวิทยาลัยเรื่องยกเลิกหลักสูตรประติมากรรม และการโต้แย้งของนักศึกษาศิลปะที่ชี้แจงว่างบประมาณแก้ได้ด้วยการจ้างอาจารย์พาร์ตไทม์",text:"Announcement: The university administration announced yesterday that the sculpture program will be eliminated. The main reason is a lack of student interest and low enrollment. Furthermore, the department’s only sculpture professor is retiring this year. Given the limited budget, hiring a new full-time professor is not justifiable. Student Discussion: As an art major, I think this is a huge loss for the department. The university has got it all wrong. The low enrollment isn’t because students lack interest in sculpture. The problem is that sculpture classes are optional electives, while mandatory painting and drawing courses consume all our time! What we really need is different degree requirements so art majors can explore sculpture. And regarding the budget, if money is the problem, they don’t need a costly full-time hire. They could hire a part-time professor or ask existing painting faculty who have secondary expertise in sculpture to teach the class!"},{id:"track-7",title:"TOEFL Speaking Task 4: Animal Tool Definitions (Narrow vs Broad) (Activity 33)",unit:"Unit 7",speaker:"Biology Professor",accent:"en-US",description:"การบรรยายชีววิทยาเรื่องคำนิยามของเครื่องมือ (Tool): นิยามแบบแคบ (ชิมแปนซีเหลากิ่งไม้) เทียบกับนิยามแบบกว้าง (ช้างหยิบกิ่งไม้มาเกาหลัง)",text:"Human beings are not the only animals that use tools. It is generally recognized that other animals use tools naturally in the wild without any human instruction. But when can we say that an object is a tool? Well, it depends on your definition, and in fact, there are two competing definitions. A narrow definition says that a tool is an object that is used to perform a specific task, but the object has got to be purposefully changed or shaped by the animal so that it can be used. For example, wild chimpanzees use sticks to dig insects out of their nests. But most sticks lying around won’t fit into the holes. So the chimps pull off the leaves, chew the stick, and trim it down until it is the right size. In this way, they intentionally adapt the object to their needs. The broad definition, on the other hand, says that an object does not have to be modified to be considered a tool. It is simply any object used to perform a specific task. For example, an elephant will pick up a fallen stick from the ground and scratch its back with it. The elephant uses it just as it is found without making any modifications. Under the broad definition, it is indeed a tool; but under the narrow definition, it is not."},{id:"track-8",title:"TOEIC Listening Part 1: Photographs - Business Meeting & Blueprints",unit:"Unit 8",speaker:"TOEIC Official Narrator",accent:"en-US",description:"ข้อสอบจำลอง TOEIC Part 1 การบรรยายภาพทีมวิศวกรและสถาปนิกกำลังตรวจดูพิมพ์เขียวบนโต๊ะประชุม",text:"Look at the photograph marked Number One in your test booklet. Choice A: They are painting the office walls. Choice B: They are reviewing architectural blueprints on the conference table. Choice C: They are packing luggage into the trunk of a car. Choice D: They are boarding an international flight at the departure gate."},{id:"track-9",title:"TOEIC Listening Part 2: Question-Response (When, Who, Indirect)",unit:"Unit 8",speaker:"TOEIC Test Speakers",accent:"en-US",description:"คำถาม-คำตอบสถานการณ์ทำงาน: กำหนดส่งรายงานการตลาด, ผู้รับผิดชอบจัดประชุมประจำปี, และสถานะการซ่อมเครื่องถ่ายเอกสาร",text:"Number One: When is the revised budget proposal due for the marketing campaign? Choice A: Yes, I enjoyed the seminar. Choice B: It has been extended until next Friday afternoon. Choice C: In the third-floor conference hall. Number Two: Who is responsible for organizing the annual regional conference this year? Choice A: Ms. Patterson from Human Resources is in charge of it. Choice B: Yes, the conference was very productive. Choice C: By express courier. Number Three: Has the technician repaired the color photocopier on the third floor yet? Choice A: He is still waiting for a replacement part to arrive from Bangkok. Choice B: Ten copies per minute, please. Choice C: No, I didn't see the painting."},{id:"track-10",title:"TOEIC Listening Part 3: Short Conversation (Shipment Weather Delay)",unit:"Unit 8",speaker:"Colleagues in Logistics",accent:"en-US",description:"บทสนทนาระหว่างเพื่อนร่วมงานเรื่องพัสดุชิปคอมพิวเตอร์ล่าช้าจากพายุฝน และการโทรศัพท์แจ้งเลื่อนนัดลูกค้า",text:"Man: Rachel, did you hear that the shipment of microchips from Singapore has been delayed due to severe thunderstorms? Woman: Oh no, our demonstration with the international clients is scheduled for tomorrow morning! What are we going to do? Man: Don’t worry, I will contact the client right away to explain the weather disruption and reschedule the presentation for Thursday afternoon. That should give customs enough time to clear the cargo."},{id:"track-11",title:"TOEIC Listening Part 4: Short Talk (Airport Gate Relocation)",unit:"Unit 8",speaker:"Airport Gate Announcer",accent:"en-US",description:"ประกาศจากท่าอากาศยานแจ้งผู้โดยสารเรื่องการเปลี่ยนประตูขึ้นเครื่องบินและการเริ่มเรียกขึ้นเครื่อง",text:"Attention passengers on Skylink Airways Flight 402 departing for Tokyo Narita. Due to routine aircraft maintenance, your departure gate has been moved from Gate B8 to Gate C15. Boarding will commence at approximately 4:30 PM. Any passengers requiring special boarding assistance or traveling with small children are requested to report directly to the customer service counte
