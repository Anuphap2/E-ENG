})]},le)})})]})}const it=[{id:1,unit:"Unit 5",topic:"5.1-5.4 Degree Qualifications",type:"reading",hasAudio:!1,q:"Which of the following is considered an 'undergraduate' academic degree typically pursued immediately after completing high school?",options:["A. Master of Science (MSc)","B. Bachelor of Arts (BA)","C. Doctor of Philosophy (PhD)","D. Postdoctoral Fellowship"],answer:1,explanation:"ตามเอกสาร Unit 5: 'bachelor’s degree' (เช่น BA หรือ BSc) เป็นระดับ undergraduate degree ซึ่งเป็นปริญญาขั้นแรกหลังจากจบการศึกษาระดับมัธยมปลาย (high school) ส่วน Master’s และ PhD เป็นระดับ postgraduate / graduate level",tip:"จำง่ายๆ: Under-graduate = ปริญญาตรี (ก่อนจบการศึกษาขั้นแรก) / Post-graduate = ปริญญาโท-เอก (หลังจบป.ตรี)"},{id:2,unit:"Unit 5",topic:"5.1-5.4 Degree Duration & Requirements",type:"reading",hasAudio:!1,q:"According to academic standards, a master's degree typically takes __________ to complete and usually requires the submission of an independent study project or a __________.",options:["A. 4–6 years; dissertation","B. 1–3 years; thesis","C. 3.5–6 years; high school diploma","D. 6–12 months; vocational certificate"],answer:1,explanation:"ตามหนังสือ Unit 5: ปริญญาโท (master's degree) มักใช้เวลาศึกษาประมาณ 1–3 ปี โดยผู้เรียนส่วนใหญ่ต้องจัดทำและส่ง 'independent study project' (การค้นคว้าอิสระ) หรือ 'thesis' (วิทยานิพนธ์)",tip:"Master's degree = 1-3 ปี + Thesis | PhD = 3.5-6 ปี + Dissertation"},{id:3,unit:"Unit 5",topic:"5.1-5.4 Doctoral Degree",type:"reading",hasAudio:!1,q:"Graduates of a PhD program or doctoral degree are entitled to use which academic title before their name?",options:["A. Prof.","B. Assoc. Prof.","C. Dr.","D. Dean"],answer:2,explanation:"ผู้สำเร็จการศึกษาระดับปริญญาเอก (PhD / Doctoral degree) มีสิทธิ์ใช้คำนำหน้านามว่า 'Dr.' (Doctor) ในขณะที่ Prof. หรือ Assoc. Prof. เป็นตำแหน่งทางวิชาการ (academic rank) ที่ต้องได้รับการแต่งตั้ง",tip:"จบ PhD ได้คำนำหน้า 'Dr.' เสมอ ไม่ใช่ได้ตำแหน่ง Prof. ทันที"},{id:4,unit:"Unit 5",topic:"5.1-5.4 Academic Terminology",type:"reading",hasAudio:!1,q:"An educational arrangement where a student earns two distinct degrees within a single enrollment period is officially called a __________.",options:["A. vocational certificate","B. double degree","C. distance learning module","D. study exchange fellowship"],answer:1,explanation:"Double degree (ปริญญาคู่) คือหลักสูตรที่ผู้เรียนสามารถได้รับ 2 ปริญญาในการสมัครเข้าเรียนครั้งเดียว (get two degrees in one enrolment) ตัวอย่างเช่น เรียนควบปริญญาตรี 2 สาขา หรือเรียนควบสถาบันต่างประเทศ",tip:"Double degree = 2 degrees in 1 enrolment"},{id:5,unit:"Unit 5",topic:"5.1-5.4 Fields of Study (BA vs BSc)",type:"reading",hasAudio:!1,q:"A student pursuing a Bachelor of Science (BSc) degree is most likely studying which of the following subjects?",options:["A. French Literature and Philosophy","B. Computer Science and Engineering","C. Ancient World History and Fine Arts","D. Creative Writing and Journalism"],answer:1,explanation:"BA (Bachelor of Arts) เน้นสาขามนุษยศาสตร์ สังคมศาสตร์ ภาษา และศิลป์ ส่วน BSc (Bachelor of Science) เน้นด้านวิทยาศาสตร์ เทคโนโลยี วิศวกรรมศาสตร์ และคณิตศาสตร์ (STEM)",tip:"BA = Arts, Humanities, Languages | BSc = Science, Technology, Engineering, Math"},{id:6,unit:"Unit 5",topic:"5.1-5.4 Grammar & Capitalization Rules",type:"grammar",hasAudio:!1,q:"Which of the following sentences adheres correctly to standard English capitalization rules for academic degrees?",options:["A. She holds a Bachelor's Degree in organic chemistry.","B. He completed his bachelor's degree in biology last year.","C. They are both pursuing Master's Degrees in computer engineering.","D. I graduated with a Doctoral Degree in public health."],answer:1,explanation:"ตามไวยากรณ์ในเอกสาร Unit 5: คำว่า bachelor's degree และ master's degree เป็นคำนามทั่วไป (common nouns) ต้องเขียนด้วยตัวพิมพ์เล็ก (lowercase) ยกเว้นเมื่อระบุเป็นชื่อหลักสูตรเฉพาะ เช่น 'Bachelor of Arts' หรือ 'Master of Science'",tip:"เขียนชื่อปริญญาทั่วไป: bachelor's degree, master's degree (พิมพ์เล็ก) / เขียนชื่อเต็มเฉพาะ: Master of Science (พิมพ์ใหญ่)"},{id:7,unit:"Unit 5",topic:"5.1-5.4 Academic Roles (Supervisor & Advisor)",type:"reading",hasAudio:!1,q:"In postgraduate studies, an instructor who provides continuous academic guidance, monitors research progress, and supervises a student's thesis is termed a(n) __________.",options:["A. candidate","B. applicant","C. advisor / supervisor","D. registrar"],answer:2,explanation:"Advisor หรือ Supervisor คืออาจารย์ที่ปรึกษาวิทยานิพนธ์ (an instructor who supervises students and guides their thesis/dissertation) ส่วน candidate/applicant คือผู้สมัครเข้าเรียน",tip:"Advisor (US) / Supervisor (UK) = อาจารย์ที่ปรึกษางานวิจัย"},{id:8,unit:"Unit 5",topic:"5.1-5.4 University Terminology (Faculty)",type:"reading",hasAudio:!1,q:"The term 'Faculty' in a university context can refer to both a specific academic division (e.g., Faculty of Engineering) and __________.",options:["A. the undergraduate students enrolled in the program","B. the collective academic staff and professors who teach at the institution","C. the financial loans granted to foreign students","D. the administrative dormitory buildings on campus"],answer:1,explanation:"ในภาษาอังกฤษ 'Faculty' มี 2 ความหมายหลัก: 1) คณะวิชา (division/department in a university) และ 2) คณาจารย์ / บุคลากรผู้สอนทั้งหมดในมหาวิทยาลัย (collective academic staff/professors)",tip:"Faculty = คณะ (ส่วนงาน) หรือ คณาจารย์ (กลุ่มอาจารย์)"},{id:9,unit:"Unit 5",topic:"5.1-5.4 Academic Titles (US vs UK)",type:"reading",hasAudio:!1,q:"What is the key difference between the usage of 'Professor' in the United States versus the United Kingdom?",options:["A. In the UK, anyone teaching in college is called professor, whereas in the US, it is strictly reserved for the university president.","B. In the US, 'professor' is commonly used as a general term for any college lecturer, while in the UK, it is a prestigious title reserved for senior academics.","C. The title 'professor' does not exist in British higher education.","D. In the US, professors must possess a medical license, whereas in the UK they do not."],answer:1,explanation:"ตามเอกสาร Unit 5 หัวข้อ 19: ในสหรัฐฯ (US) คำว่า 'professor' มักถูกใช้เรียกอาจารย์ผู้สอนในมหาวิทยาลัยทุกคนเป็นการทั่วไป แต่ในสหราชอาณาจักร (UK) และเครือจักรภพ จะเรียกอาจารย์ทั่วไปว่า 'lecturer' และสงวนคำว่า 'professor' ไว้สำหรับผู้มีตำแหน่งวิชาการระดับสูงเท่านั้น",tip:"US: เรียกอาจารย์มหาวิทยาลัยทุกคนว่า Professor / UK: อาจารย์ทั่วไปคือ Lecturer ส่วนตำแหน่งสูงสุดคือ Professor"},{id:10,unit:"Unit 5",topic:"5.1-5.4 Academic Ranking Hierarchy",type:"reading",hasAudio:!1,q:"Arrange the standard academic ranks in ascending order of seniority (from entry-level to highest):",options:["A. Professor -> Associate Professor -> Assistant Professor","B. Assistant Professor -> Associate Professor -> Professor","C. Associate Professor -> Assistant Professor -> Professor","D. Lecturer -> Professor -> Associate Professor"],answer:1,explanation:"ลำดับตำแหน่งทางวิชาการจากระดับแรกไปสู่ระดับสูงสุด: ผู้ช่วยศาสตราจารย์ (Assist. Prof.) -> รองศาสตราจารย์ (Assoc. Prof.) -> ศาสตราจารย์ (Prof.)",tip:"Assist. Prof (ผศ.) -> Assoc. Prof (รศ.) -> Prof. (ศ.)"},{id:11,unit:"Unit 5",topic:"5.1-5.4 Financial Vocabulary (Tuition vs Scholarship)",type:"reading",hasAudio:!1,q:"Financial aid awarded to a student to support their academic studies, which does NOT need to be repaid, is called a __________.",options:["A. student loan","B. tuition fee","C. scholarship","D. living expense"],answer:2,explanation:"Scholarship (ทุนการศึกษา) คือเงินช่วยเหลือสนับสนุนทางการศึกษาที่ไม่ต้องชำระคืน แตกต่างจาก Student Loan (เงินกู้ยืมเพื่อการศึกษา) ที่ต้องชำระคืนภายหลัง",tip:"Scholarship = ทุนให้เปล่าไม่ต้องคืน | Loan = เงินกู้ต้องใช้คืน"},{id:12,unit:"Unit 5",topic:"5.1-5.4 Academic Vocabulary (Enrollment & Eligibility)",type:"vocabulary",hasAudio:!1,q:"If a postgraduate candidate meets all the admission criteria and prerequisites, they are considered __________ for the degree program.",options:["A. mandatory","B. eligible","C. reluctant","D. vocational"],answer:1,explanation:"Eligible (adj.) หมายถึง มีคุณสมบัติเหมาะสมหรือครบถ้วนตามเกณฑ์ (having the necessary qualities or satisfying conditions)",tip:"Eligible = มีคุณสมบัติครบ / Eligibility = คุณสมบัติ"},{id:13,unit:"Unit 5",topic:"5.1-5.4 Academic Vocabulary (Activity 20 Fill-in)",type:"vocabulary",hasAudio:!1,q:"Complete the sentence from Activity 20: 'Pursuing a master’s degree in a specialized field requires careful planning, including deciding which postgraduate program to __________ in.'",options:["A. enroll","B. evaluate","C. eliminate","D. enforce"],answer:0,explanation:"คำกริยาที่ใช้คู่กับคำว่า 'in a program / course' สำหรับการลงทะเบียนเรียนคือ 'enroll in' (หรือ register for)",tip:"Enroll in a program = ลงทะเบียนเข้าเรียนในหลักสูตร"},{id:14,unit:"Unit 5",topic:"5.5 Test Overview & Comparison",type:"reading",hasAudio:!1,q:"Which English proficiency test is primarily designed to assess English communication skills in international business and workplace environments?",options:["A. IELTS Academic","B. TOEFL iBT","C. TOEIC","D. CU-TEP"],answer:2,explanation:"TOEIC (Test of English for International Communication) ได้รับการออกแบบมาเฉพาะสำหรับการสื่อสารในสภาพแวดล้อมทางธุรกิจและการทำงานระดับสากล (professional and workplace contexts)",tip:"IELTS / TOEFL = เน้นวิชาการ (Academic) เพื่อศึกษาต่อ | TOEIC = เน้นธุรกิจและทำงาน (Business / Workplace)"},{id:15,unit:"Unit 5",topic:"5.5 Test Score Scales",type:"reading",hasAudio:!1,q:"What is the official scoring scale for the IELTS exam across individual sections and overall performance?",options:["A. 0 to 120 points","B. 10 to 990 points","C. Band 0 to 9.0","D. 310 to 677 points"],answer:2,explanation:"IELTS วัดผลคะแนนเป็นระดับ 'Band' ตั้งแต่ 0 ถึง 9.0 ทั้งคะแนนรายทักษะและคะแนนเฉลี่ยรวม (Overall Band Score)",tip:"IELTS: 0-9 Band | TOEFL iBT: 0-120 | TOEIC: 10-990 | TOEFL ITP: 310-677"},{id:16,unit:"Unit 5",topic:"5.5 Test Score Scales (TOEFL iBT vs ITP)",type:"reading",hasAudio:!1,q:"The TOEFL iBT uses an overall score range of 0–120 points, whereas the paper-based TOEFL ITP uses a total score scale of __________.",options:["A. 10 to 90 points","B. 310 to 677 points","C. 0 to 9 points","D. 10 to 160 points"],answer:1,explanation:"ตามตารางเปรียบเทียบใน Unit 5: TOEFL iBT มีคะแนนเต็ม 120 (4 ทักษะ ทักษะละ 30 คะแนน) ส่วน TOEFL ITP มีช่วงคะแนนรวมอยู่ที่ 310 ถึง 677 คะแนน",tip:"TOEFL iBT: 0-120 คะแนน | TOEFL ITP: 310-677 คะแนน"},{id:17,unit:"Unit 5",topic:"5.5 Score Validity Period",type:"reading",hasAudio:!1,q:"Official score reports for international standardized English tests such as IELTS, TOEFL, and TOEIC are typically valid for how long?",options:["A. 6 months","B. 1 year","C. 2 years","D. A lifetime"],answer:2,explanation:"ผลคะแนนสอบมาตรฐานสากลทั้ง IELTS, TOEFL, และ TOEIC รวมถึง CU-TEP และ TU-GET ล้วนมีอายุการใช้งาน 2 ปี (Two years) นับจากวันสอบ",tip:"ผลสอบภาษาอังกฤษสากลเกือบทั้งหมดมีอายุ 2 ปี (Validity: 2 years)"},{id:18,unit:"Unit 5",topic:"5.5 Test Administrators",type:"reading",hasAudio:!1,q:"Which organization administers the TOEFL test globally, and which organizations administer IELTS in Thailand?",options:["A. Cambridge administers TOEFL; ETS administers IELTS.","B. ETS administers TOEFL; British Council and IDP Education administer IELTS.","C. CPA Thailand administers TOEFL; LITU administers IELTS.","D. Duolingo administers TOEFL; Pearson administers IELTS."],answer:1,explanation:"TOEFL บริหารและจัดสอบโดย ETS (Educational Testing Service) ส่วน IELTS ในประเทศไทยจัดสอบโดย British Council Thailand และ IDP Education Thailand สำหรับ TOEIC ในไทยจัดโดย CPA Thailand",tip:"TOEFL -> ETS | IELTS -> British Council & IDP | TOEIC in TH -> CPA Thailand"},{id:19,unit:"Unit 5",topic:"5.5 Modern Computer-Adaptive Tests (DET & PTE)",type:"reading",hasAudio:!1,q:"The Duolingo English Test (DET) is known for being a computer-adaptive exam lasting approximately 1 hour with a scoring scale of __________.",options:["A. 10 to 90 points","B. 10 to 160 points","C. 0 to 9 bands","D. 200 to 800 points"],answer:1,explanation:"DET (Duolingo English Test) เป็นข้อสอบปรับตามความสามารถผู้สอบ (computer-adaptive) ใช้เวลาประมาณ 1 ชั่วโมง และให้คะแนนในช่วง 10 ถึง 160 คะแนน",tip:"DET: 10-160 คะแนน (1 ชม.) | PTE: 10-90 คะแนน (3 ชม.)"},{id:20,unit:"Unit 5",topic:"5.5 Domestic English Proficiency Tests",type:"reading",hasAudio:!1,q:"In Thailand, which two domestic English proficiency tests are commonly administered by Chulalongkorn University and Thammasat University respectively?",options:["A. GAT and PAT","B. CU-TEP and TU-GET","C. O-NET and A-Level","D. CEFR and TOEIC"],answer:1,explanation:"CU-TEP (Chulalongkorn University Test of English Proficiency คะแนนเต็ม 120) และ TU-GET (Thammasat University General English Test) เป็นข้อสอบภาษาอังกฤษระดับอุดมศึกษาชั้นนำที่จัดสอบโดยมหาวิทยาลัยในไทย",tip:"CU-TEP = จุฬาลงกรณ์มหาวิทยาลัย | TU-GET = มหาวิทยาลัยธรรมศาสตร์"},{id:21,unit:"Unit 6",topic:"6.1 IELTS Reading (Marie Curie)",type:"reading",hasAudio:!1,passage:"Marie Curie is probably the most famous woman scientist who has ever lived. Born Maria Sklodowska in Poland in 1867, she is famous for her work on radioactivity and was twice a winner of the Nobel Prize. With her husband, Pierre Curie, and Henri Becquerel, she was awarded the 1903 Nobel Prize for Physics and was then the sole winner of the 1911 Nobel Prize for Chemistry. She was the first woman to win a Nobel Prize.",q:"[IELTS Reading - Activity 23] Statement 1: 'Marie Curie’s husband was a joint winner of both of Marie’s Nobel Prizes.' Based on the text, this statement is:",options:["A. TRUE","B. FALSE","C. NOT GIVEN","D. INVALID"],answer:1,explanation:"FALSE เพราะเนื้อหาระบุว่า ปี 1903 เธอได้รับรางวัลร่วมกับสามี (Pierre Curie) และ Henri Becquerel แต่ในปี 1911 เธอเป็น 'the sole winner' (ผู้ชนะเพียงผู้เดียว) ในสาขาเคมี สามีจึงไม่ได้ร่วมรับรางวัลทั้ง 2 ครั้ง",tip:"sole winner = ผู้ชนะเพียงผู้เดียว ขัดแย้งกับคำว่า 'both' จึงตอบ FALSE"},{id:22,unit:"Unit 6",topic:"6.1 IELTS Reading (Marie Curie)",type:"reading",hasAudio:!1,passage:"From childhood, Marie was remarkable for her prodigious memory, and at the age of 16 won a gold medal on completion of her secondary education. Because her father lost his savings through bad investment, she then had to take work as a teacher. From her earnings, she was able to finance her sister Bronia’s medical studies in Paris, on the understanding that Bronia would, in turn, later help her to get an education.",q:"[IELTS Reading - Activity 23] Statement 2: 'Marie became interested in science when she was a child.' Based on the text, this statement is:",options:["A. TRUE","B. FALSE","C. NOT GIVEN","D. PROBABLE"],answer:2,explanation:"NOT GIVEN เพราะในบทความกล่าวเพียงว่าในวัยเด็กเธอมีความจำอันยอดเยี่ยม (prodigious memory) และได้เหรียญทองตอนอายุ 16 ปี แต่ไม่ได้มีข้อมูลระบุว่าเธอเริ่มสนใจวิทยาศาสตร์ตั้งแต่ตอนเด็กหรือไม่",tip:"ถ้าในบทความไม่มีข้อความยืนยันหรือปฏิเสธอย่างชัดเจน ให้ตอบ NOT GIVEN"},{id:23,unit:"Unit 6",topic:"6.1 IELTS Reading (Marie Curie)",type:"reading",hasAudio:!1,passage:"In 1891, this promise was fulfilled, and Marie went to Paris and began to study at the Sorbonne (the University of Paris). She often worked far into the night and lived on little more than bread and butter and tea. She came first in the examination in the physical sciences in 1893, and in 1894 was placed second in the examination in mathematical sciences.",q:"[IELTS Reading - Activity 23] Statement 3: 'Marie was able to attend the Sorbonne because of her sister’s financial contribution.' Based on the text, this statement is:",options:["A. TRUE","B. FALSE","C. NOT GIVEN","D. UNLIKELY"],answer:0,explanation:"TRUE เพราะย่อหน้าก่อนหน้าระบุข้อตกลงว่า Marie ทำงานส่งเสียพี่สาว (Bronia) เรียนแพทย์ โดยมีข้อตกลงว่าพี่สาวจะช่วยเหลือเธอในภายหลัง และในย่อหน้านี้ระบุว่า 'this promise was fulfilled, and Marie went to Paris and began to study at the Sorbonne'",tip:"promise was fulfilled = รักษาสัญญาในการส่งเสียเงินคืน จึงตอบ TRUE"},{id:24,unit:"Unit 6",topic:"6.1 IELTS Reading Vocabulary",type:"vocabulary",hasAudio:!1,q:"In the passage about Marie Curie, the phrase 'remarkable for her prodigious memory' implies that her memory was __________.",options:["A. exceptionally extraordinary and vast","B. unreliable and frequently faulty","C. strictly focused on mathematics","D. acquired through formal medical training"],answer:0,explanation:"'Prodigious' (adj.) แปลว่า มหัศจรรย์, ยิ่งใหญ่เป็นพิเศษ, น่าทึ่ง (extraordinary, exceptional, immense) ดังนั้น prodigious memory จึงหมายถึงความจำที่ยอดเยี่ยมอย่างน่าอัศจรรย์",tip:"Prodigious = ยอดเยี่ยม, มหาศาล (รากศัพท์เดียวกับคำว่า prodigy ผู้มีความสามารถพิเศษ)"},{id:25,unit:"Unit 6",topic:"6.1 IELTS Reading (The Marvellous Invention)",type:"reading",hasAudio:!1,passage:"Of all the things humans have created, language is the most important... It is also an incredibly sophisticated tool, built on a simple but brilliant idea: from just about 25 to 30 basic sounds, we can create countless expressions to share everything we think and feel... Still, there is one big contradiction in all this praise: we call language the greatest human invention—but the truth is, it was never really invented.",q:"[IELTS Reading - Activity 24] What fascinating contradiction or paradox about language is highlighted by the author?",options:["A. Language separates humans from nature rather than connecting them.","B. We call language the greatest human invention, yet it was never deliberately invented by anyone.","C. Written language is superior to spoken language in conveying complex emotions.","D. French scholars proved that language lacks any logical foundation."],answer:1,explanation:"ตามบทความ Activity 24: ความขัดแย้งที่น่าสนใจ (paradox / contradiction) คือ มนุษย์ยกย่องภาษาว่าเป็นสิ่งประดิษฐ์ที่ยิ่งใหญ่ที่สุด แต่ความจริงแล้วภาษาไม่เคยถูกใครคนใดคนหนึ่งตั้งใจ 'ประดิษฐ์ขึ้นมา' (never deliberately invented)",tip:"Paradox = สิ่งที่ขัดแย้งกันในตัวเอง (greatest invention BUT never really invented)"},{id:26,unit:"Unit 6",topic:"6.1 IELTS Reading Summary Completion",type:"vocabulary",hasAudio:!1,q:"Complete the sentence from Activity 24: 'Though language is a highly __________ system, it is built on a simple idea—using a small number of sounds to create an infinite variety of expressions.'",options:["A. primitive","B. sophisticated","C. accidental","D. temporary"],answer:1,explanation:"จากข้อสอบ Summary Completion ในหนังสือ คำที่ถูกต้องคือ 'sophisticated' (ซับซ้อนและได้รับการพัฒนาอย่างประณีตสูง) ขัดแย้งกับคำว่า simple idea",tip:"Sophisticated = ประณีต, ซับซ้อนและล้ำหน้า"},{id:27,unit:"Unit 6",topic:"6.2 IELTS Listening (BuildRight Recruitment)",type:"listening",hasAudio:!0,audioTitle:"IELTS Listening: BuildRight Recruitment Introduction",audioText:"Hello, everyone. My name is Alex Johnson and I’m a recruitment consultant at BuildRight Recruitment. We’re an agency that specializes in providing staff for the construction industry. Now I understand that you’re all final year students in the School of Engineering and you’re interested in working in construction. So, I’d like to talk to you today about some of the opportunities available and the skills you’ll need to succeed in this sector.",passage:"Listening Track 1: Alex Johnson's Introduction to Engineering Students",q:"🎧 [IELTS Listening - Activity 25] Who is the speaker, and what is the primary role of BuildRight Recruitment?",options:["A. A university professor giving a lecture on architectural history","B. A recruitment consultant from an agency specializing in providing staff for the construction industry","C. A civil engineer advertising a newly built residential apartment complex","D. A government official announcing new municipal building safety laws"],answer:1,explanation:"ผู้บรรยายระบุว่า 'My name is Alex Johnson and I’m a recruitment consultant at BuildRight Recruitment. We’re an agency that specializes in providing staff for the construction industry.'",tip:"ฟัง Keyword: recruitment consultant, agency specializes in providing staff for the construction industry"},{id:28,unit:"Unit 6",topic:"6.2 IELTS Listening (Trends in Construction)",type:"listening",hasAudio:!0,audioTitle:"IELTS Listening: Energy Efficient Properties",audioText:"At the moment, we’re seeing increasing demand for properties that are built using energy efficient materials and green technologies to keep up with the tightening regulations. Supply depots and storage facilities are another type of construction that you could be involved in depending on your job.",passage:"Listening Track 2: Market Demand in Construction",q:"🎧 [IELTS Listening - Activity 25] According to Alex Johnson, what kind of building properties are currently in increasing demand?",options:["A. High-rise luxury hotels in city centers","B. Properties built using energy-efficient materials and green technologies","C. Traditional wooden homes using unrefined materials","D. Industrial factories operating with fossil fuels"],answer:1,explanation:"Alex Johnson กล่าวชัดเจนว่า 'we’re seeing increasing demand for properties that are built using energy efficient materials and green technologies to keep up with the tightening regulations.'",tip:"Keyword: increasing demand for properties built using energy efficient materials and green technologies"},{id:29,unit:"Unit 6",topic:"6.2 IELTS Listening (Infrastructure Surge)",type:"listening",hasAudio:!0,audioTitle:"IELTS Listening: Infrastructure Expansion",audioText:"Also, governments worldwide are investing heavily in updating and expanding infrastructure leading to a surge in projects related to roads, bridges, and bus, and rail networks. This means there’s a need for civil engineers and project planners who can oversee these large-scale projects.",passage:"Listening Track 3: Infrastructure Expansion",q:"🎧 [IELTS Listening - Activity 25] Why is there currently an urgent need for civil engineers and project planners?",options:["A. Universities are closing down engineering faculties due to budget deficits.","B. Governments worldwide are investing heavily in updating infrastructure like roads, bridges, and rail networks.","C. Private contractors are refusing to comply with green building regulations.","D. Most construction workers are relocating overseas to work in carpentry."],answer:1,explanation:"บทบรรยายระบุว่า รัฐบาลทั่วโลกลงทุนมหาศาลในการขยายและปรับปรุงโครงสร้างพื้นฐาน เช่น ถนน สะพาน และเครือข่ายรถไฟ จึงมีความต้องการ civil engineers และ project planners อย่างเร่งด่วน",tip:"Keyword: surge in projects related to roads, bridges, rail networks -> need for civil engineers"},{id:30,unit:"Unit 6",topic:"6.2 IELTS Listening (Job Roles: Site Manager)",type:"listening",hasAudio:!0,audioTitle:"IELTS Listening: Site Manager Role",audioText:"First up, we have a site manager position. This is a permanent position that involves overseeing daily operations and ensuring the project stays on schedule. This is for a large global organization. So, it requires travel to international project sites. The salary for this role is very high given the seniority of the position and the nature of the work.",passage:"Listening Track 4: Site Manager Position",q:"🎧 [IELTS Listening - Activity 26] Which of the following features accurately characterizes the 'Site Manager' position?",options:["A. It is a part-time job for 3 days a week with low entry-level compensation.","B. It is a permanent position requiring travel to international project sites and offering a very high salary.","C. It is a temporary position based in remote dormitories with fixed dates.","D. It requires no previous work ethic references or managerial qualifications."],answer:1,explanation:"บทบรรยายระบุว่า Site Manager เป็น 'permanent position' ทำงานกับองค์กรระดับโลก ต้องเดินทางไปต่างประเทศ ('requires travel to international project sites') และได้รับค่าตอบแทนสูงมาก ('salary is very high')",tip:"Site Manager = Permanent + International travel + Very high salary"},{id:31,unit:"Unit 6",topic:"6.2 IELTS Listening (Job Roles: Building Laborers)",type:"listening",hasAudio:!0,audioTitle:"IELTS Listening: Building Laborers",audioText:"We also have an open position for building laborers. This is an entry-level position ideal for those wanting a first job in this industry. No formal qualifications are needed but applicants must provide details of previous employers who can vouch for their reliability and work ethic.",passage:"Listening Track 5: Building Laborers Role",q:"🎧 [IELTS Listening - Activity 26] What is required of applicants applying for the 'Building Laborers' position?",options:["A. A bachelor's degree in structural engineering","B. A certificate 3 in carpentry","C. Details of previous employers who can vouch for their reliability and work ethic","D. At least five years of heavy crane operating experience"],answer:2,explanation:"สำหรับตำแหน่ง Building Laborers ไม่ต้องใช้วุฒิการศึกษาเฉพาะ ('No formal qualifications are needed') แต่ต้องมีข้อมูลนายจ้างเก่าที่รับรองความน่าเชื่อถือและความประพฤติในการทำงานได้ ('vouch for their reliability and work ethic')",tip:"Building Laborers = Entry-level, no formal qualifications, need references to vouch for reliability"},{id:32,unit:"Unit 6",topic:"6.2 IELTS Listening (Job Roles: Safety Manager & Carpenter)",type:"listening",hasAudio:!0,audioTitle:"IELTS Listening: Safety Manager and Carpenter",audioText:"For those with a background in workplace safety, there’s an opening for a safety manager. The project isn’t too big or complex, so this role is for 3 days a week. There’s also a role available for a carpenter. This is a temporary role with a fixed end date. Since this job is based in a remote location, employees are based on site in dorms provided by the company. A certificate 3 in carpentry is required.",passage:"Listening Track 6: Safety Manager & Carpenter Roles",q:"🎧 [IELTS Listening - Activity 26] Why are employees hired as 'Carpenters' provided with company dormitories on site?",options:["A. They are required to undergo 24-hour safety surveillance.","B. The job is situated in a remote location and has a fixed end date.","C. The company policy requires all managerial staff to sleep on site.","D. They must operate machinery throughout the night without interruption."],answer:1,explanation:"บทบรรยายระบุว่า 'Since this job is based in a remote location, employees are based on site in dorms provided by the company.' เป็นงานชั่วคราวในพื้นที่ห่างไกล",tip:"Carpenter = Certificate 3 + Remote location + Dorms provided on site"},{id:33,unit:"Unit 6",topic:"6.2 IELTS Listening (Purchasing Coordinator)",type:"listening",hasAudio:!0,audioTitle:"IELTS Listening: Purchasing Coordinator",audioText:"Finally, we have a listing for a purchasing coordinator. This role involves working closely with suppliers to ensure materials arrive on time. We know this company well and the workers are lively and sociable. So, there’s a really positive workplace culture. A degree in business administration, finance or a related field is required.",passage:"Listening Track 7: Purchasing Coordinator Role",q:"🎧 [IELTS Listening - Activity 26] What educational background is required for the 'Purchasing Coordinator' position?",options:["A. A vocational certificate in heavy machinery maintenance","B. A degree in business administration, finance, or a related field","C. A master's degree in structural architecture","D. A certificate in residential electrical wiring"],answer:1,explanation:"Alex Johnson ระบุชัดเจนว่าตำแหน่ง Purchasing Coordinator ต้องใช้วุฒิ 'A degree in business administration, finance or a related field'",tip:"Purchasing Coordinator = Degree in business administration / finance"},{id:34,unit:"Unit 6",topic:"6.3 IELTS Speaking (Cue Card - Village Visit)",type:"speaking",hasAudio:!0,audioTitle:"IELTS Speaking: Visiting Dharampur Village",audioText:"It is always a joyful time to go to my village as it gives me a much-needed break from the hustle and bustle of city life. Whenever I visit my village, it reminds me that this is where my roots are. My village Dharampur is a quiet little village that is nestled in the Aravalli hills. My uncle Dr. John Simpson is the chief medical officer of a community health center there.",passage:"IELTS Speaking Part 2 Model Answer",q:"🎧 [IELTS Speaking - Activity 27] In the model answer describing a visit to a village, what idiomatic expression was used to describe the chaotic noise and rapid pace of urban living?",options:["A. safe and sound","B. hustle and bustle","C. odds and ends","D. sick and tired"],answer:1,explanation:"'Hustle and bustle' เป็นสำนวนยอดนิยมในข้อสอบ IELTS แปลว่า ความวุ่นวาย เร่งรีบ และจอแจของชีวิตในเมืองใหญ่",tip:"Hustle and bustle of city life = ความเร่งรีบจอแจของชีวิตคนเมือง"},{id:35,unit:"Unit 6",topic:"6.3 IELTS Speaking (Volunteer Work)",type:"speaking",hasAudio:!0,audioTitle:"IELTS Speaking: Vaccination Campaign",audioText:"Our government is very determined to eradicate juvenile diseases such as smallpox and polio. When I went to the health center, I saw a long queue of village women. My uncle asked me whether I would like to work as his assistant. He assigned me the task of filling up forms for the villagers as some of them were either illiterate or had difficulties in writing. This experience taught me a valuable lesson of selfless service.",passage:"IELTS Speaking Part 2 Volunteer Experience",q:"🎧 [IELTS Speaking - Activity 27] What specific task did the speaker assist with during the smallpox vaccination campaign at the village health center?",options:["A. Administering injections directly to infants","B. Filling up official medical registration forms for illiterate villagers","C. Transporting medical supplies from the capital by train","D. Preparing lunches and mango feasts for the medical doctors"],answer:1,explanation:"ผู้พูดได้รับมอบหมายให้ช่วยกรอกแบบฟอร์มให้กับชาวบ้านที่ไม่รู้หนังสือหรือเขียนหนังสือไม่คล่อง ('assigned me the task of filling up forms for the villagers as some of them were either illiterate...')",tip:"Task = filling up forms for villagers who were illiterate"},{id:36,unit:"Unit 6",topic:"6.3 IELTS Speaking (Part 3 Discussion)",type:"speaking",hasAudio:!1,q:"[IELTS Speaking - Activity 28] According to the discussion, why are more urban residents expected to move to rural villages in the future?",options:["A. Agricultural wages are now higher than corporate salaries in cities.","B. People are exhausted by crowded living conditions in cities, and modern 'work-from-home' technology makes living in villages feasible.","C. The government is forcing urban workers to relocate to rural farms.","D. Public transport in cities has been completely phased out."],answer:1,explanation:"ตามคำตอบใน Activity 28: ผู้คนเหนื่อยหน่ายกับความแออัดในเมือง และในปัจจุบันมีเทคโนโลยีการทำงานจากที่บ้าน (work-from-home) ทำให้ผู้คนสามารถย้ายไปอาศัยในชนบทเพื่อสูดอากาศบริสุทธิ์และลดความเครียดได้",tip:"Relocating to villages = Tired of crowds + Work-from-home possibility + Cleaner air"},{id:37,unit:"Unit 6",topic:"6.4 IELTS Writing (Task 1 Process Stages)",type:"writing",hasAudio:!1,q:"[IELTS Writing Task 1 - Brick Manufacturing Process] In the manufacturing of bricks described in the coursebook, what happens immediately after clay is dug up from the ground?",options:["A. It is heated in a kiln at 1300°C for three days.","B. It is placed onto a metal grid and crushed by a roller into smaller pieces.","C. It is packaged into delivery trucks immediately.","D. It is immersed in water inside a cooling chamber."],answer:1,explanation:"ขั้นตอนกระบวนการผลิตอิฐ (Brick Making): เมื่อขุดดินเหนียว (clay) ขึ้นมาแล้ว ขั้นต่อไปคือดินจะถูกเทลงบนตะแกรงโลหะ (metal grid) โดยมีลูกกลิ้ง (roller) ช่วยบดดินให้เป็นชิ้นเล็กๆ ก่อนผสมทรายและน้ำ",tip:"Step 1: Digging clay -> Step 2: Metal grid & roller -> Step 3: Add sand & water"},{id:38,unit:"Unit 6",topic:"6.4 IELTS Writing (Task 1 Temperatures & Drying)",type:"writing",hasAudio:!1,q:"[IELTS Writing Task 1 - Brick Process] According to the sample report, for how long are shaped bricks dried in an oven, and at what temperature are they heated in the kiln?",options:["A. Dried for 1–2 hours; heated at 50°C to 100°C","B. Dried for 24–48 hours; heated at moderate to high temperatures (200°C to 1300°C)","C. Dried for 7 days; heated at below freezing temperatures","D. Dried in direct sunlight for a month; no kiln heating required"],answer:1,explanation:"ตามตัวอย่างบทความในหนังสือ: อิฐที่ขึ้นรูปแล้วจะถูกอบแห้งในเตา (drying oven) เป็นเวลา 24–48 ชั่วโมง จากนั้นนำไปเผาในเตาเผา (kiln) ที่อุณหภูมิตั้งแต่ 200°C ถึง 1300°C แล้วพักในห้องหล่อเย็น 2–3 วัน",tip:"Drying: 24-48 hours | Kiln heating: 200°C - 1300°C | Cooling: 2-3 days"},{id:39,unit:"Unit 6",topic:"6.4 IELTS Writing (Task 2 Essay Structure)",type:"writing",hasAudio:!1,q:"What are the two indispensable structural elements required in the Introduction paragraph of an IELTS Task 2 academic essay?",options:["A. A detailed bibliography and statistical raw data table","B. A paraphrase of the background topic and a clear thesis statement expressing the writer's position","C. At least three body paragraphs and a closing salutation","D. Personal anecdotes and informal slang greetings"],answer:1,explanation:"โครงสร้างย่อหน้านำ (Introduction) ของ IELTS Writing Task 2 ต้องประกอบด้วย: 1) Paraphrase หัวข้อโจทย์ด้วยภาษาของตนเอง และ 2) Thesis statement (ประโยคระบุใจความหลัก/จุดยืนของผู้เขียนอย่างชัดเจน)",tip:"IELTS Intro = Paraphrase Prompt + Clear Thesis Statement"},{id:40,unit:"Unit 6",topic:"6.4 IELTS Writing (Task 2 Sample Topic)",type:"writing",hasAudio:!1,q:"In the IELTS Task 2 sample essay regarding technology and human relationships, what primary risk of online friendships was argued by the author?",options:["A. High internet connection subscription fees","B. Vulnerability to exploitation, financial blackmail, or security threats once personal information is shared","C. Inability to purchase software licenses abroad","D. Complete disappearance of written books"],answer:1,explanation:"บทความตัวอย่างใน Unit 6 ระบุว่าการสร้างความสัมพันธ์ออนไลน์อาจเป็น negative development เนื่องจากผู้ไม่หวังดีอาจฉวยโอกาสหลอกลวง ขู่กรรโชกทรัพย์ หรือคุกคามเมื่อทราบข้อมูลส่วนตัว ('take advantage... demanding money, threatening')",tip:"Negative impact argued = People taking advantage, financial extortion, security risks"},{id:41,unit:"Unit 7",topic:"7.1 TOEFL Reading (Craftsmen vs Industrialization)",type:"reading",hasAudio:!1,passage:"Before 1815, manufacturing in the United States was primarily conducted within homes or workshops by proficient artisans. These master craftworkers transmitted their trade expertise to apprentices and journeymen. However, following 1815, this traditional mode of manufacturing gradually yielded to factory-based production, where machinery was operated by unskilled or semi-skilled workers. Items manufactured in factories lacked the refined quality and intricate craftsmanship of handmade goods.",q:"[TOEFL Reading - Activity 29, Q1] What inference can be drawn from the passage regarding manufactured articles produced before 1815?",options:["A. They were predominantly crafted by female factory laborers.","B. They were produced with a greater emphasis on quality and meticulous craftsmanship rather than speed.","C. They were manufactured exclusively in large urban textile factories.","D. They relied heavily on automated steam-powered assembly lines."],answer:1,explanation:"ในบทความระบุว่า ก่อนปี 1815 สินค้าถูกผลิตโดยช่างฝีมือผู้ชำนาญ (proficient artisans) ในบ้านหรือโรงช่าง ซึ่งสินค้าแฮนด์เมดมีความประณีตและคุณภาพสูงกว่าสินค้าโรงงานที่เน้นปริมาณและความเร็ว",tip:"Pre-1815 = Handmade, emphasis on craftsmanship and quality rather than speed"},{id:42,unit:"Unit 7",topic:"7.1 TOEFL Reading (Apprenticeship)",type:"reading",hasAudio:!1,passage:"Prior to the emergence of factories, artisans typically worked from home. Apprentices were considered part of the family, with masters tasked not only with teaching them a trade but also providing education and overseeing their moral conduct. Journeymen understood that by honing their craft, they could ascend to respected master artisans with their own workshops.",q:"[TOEFL Reading - Activity 29, Q2] Which statement accurately conveys the master artisan's obligations toward apprentices in the pre-industrial era?",options:["A. Masters expected moral conduct from apprentices but treated them merely as disposable factory workers.","B. Masters had obligations towards apprentices beyond just teaching a trade, including education and moral guidance.","C. Masters restricted trade knowledge exclusively to biological family members.","D. Masters refused to allow journeymen to ever open their own workshops."],answer:1,explanation:"บทความระบุว่า 'masters tasked not only with teaching them a trade but also providing education and overseeing their moral conduct' แปลว่าครูช่างมีหน้าที่ดูแลทั้งการสอนวิชาชีพ การให้การศึกษา และดูแลจริยธรรมความประพฤติ",tip:"Masters' duties = Beyond just trade -> education and moral guidance"},{id:43,unit:"Unit 7",topic:"7.1 TOEFL Reading Vocabulary in Context",type:"vocabulary",hasAudio:!1,passage:"Instances of absenteeism or tardiness hindered productivity and disrupted the established factory routine, given the specialized nature of tasks. Industrialization not only revolutionized the organization of work but also fundamentally altered its essence.",q:"[TOEFL Reading - Activity 29, Q3] The word 'disrupted' in the passage is closest in meaning to which of the following?",options:["A. Prolonged","B. Established","C. Followed","D. Upset"],answer:3,explanation:"'Disrupted' ในบริบทนี้หมายถึง การทำให้เสียระเบียบ รบกวน หรือทำให้ระบบสะดุด ซึ่งมีความหมายตรงกับคำว่า 'Upset' (disturbed / interrupted)",tip:"Disrupt = Upset, interrupt, disturb (รบกวน/ทำให้สะดุด)"},{id:44,unit:"Unit 7",topic:"7.1 TOEFL Reading Rhetorical Purpose",type:"reading",hasAudio:!1,passage:"The factory clock emerged as a symbol of the altered work regulations. An example is provided by a mill worker who eventually resigned, articulating discontent about 'obedience to the ding-dong of the bell—just as though we are so many living machines.'",q:"[TOEFL Reading - Activity 29, Q4] Why does the author incorporate the quotation from the mill worker complaining about the 'ding-dong of the bell'?",options:["A. To bolster the notion that early workers found it challenging and dehumanizing to adapt to rigid factory discipline.","B. To demonstrate that factory machinery was too noisy for workers to hear emergency signals.","C. To argue that factory owners should replace bells with mechanical digital watches.","D. To prove that nineteenth-century workers preferred living machines over handmade tools."],answer:0,explanation:"ผู้เขียนยกคำพูดของคนงานโรงสีที่ว่าต้องเชื่อฟังเสียงระฆังราวกับเป็นเครื่องจักรที่มีชีวิต ('living machines') เพื่อตอกย้ำให้เห็นว่าคนงานรุ่นแรกๆ รู้สึกอึดอัดและปรับตัวได้ยากมากกับกฎระเบียบและเวลาอันเข้มงวดของระบบโรงงาน",tip:"Quote purpose = Bolster/illustrate workers' difficulty adapting to rigid factory discipline"},{id:45,unit:"Unit 7",topic:"7.1 TOEFL Reading Negative Factual Question",type:"reading",hasAudio:!1,passage:"With the erosion of personal liberties, there also came a decline in social standing. Unlike artisan workshops where apprentices closely collaborated with overseeing masters, factories created a distinct separation between laborers and management. Few workers ascended to supervisory roles, and even fewer realized the artisan's aspiration of establishing their own enterprise. Despite receiving adequate wages, workers sensed a deterioration in their societal status.",q:"[TOEFL Reading - Activity 29, Q5] Which of the following is NOT listed as a loss or negative consequence suffered by workers under the new factory system?",options:["A. Loss of personal independence and liberties","B. Decline in social standing and community status","C. Interaction among non-managerial fellow workers","D. Diminished opportunities for upward advancement or owning their own business"],answer:2,explanation:"บทความระบุผลเสียต่อคนงาน ได้แก่ การสูญเสียอิสรภาพส่วนตัว (erosion of personal liberties), ฐานะทางสังคมตกต่ำลง (decline in social standing), และโอกาสก้าวหน้าเปิดกิจการตนเองแทบไม่มี (few realized aspiration of establishing own enterprise) แต่ไม่ได้ระบุว่าการปฏิสัมพันธ์ระหว่างคนงานด้วยกันเองเป็นผลเสียที่หายไป",tip:"Negative factual question: มองหาตัวเลือกที่บทความไม่ได้กล่าวว่าเป็นสิ่งที่สูญเสียไป"},{id:46,unit:"Unit 7",topic:"7.1 TOEFL Reading Labor Movement Challenges",type:"reading",hasAudio:!1,passage:"Workers shared a common resentment towards industrialization and the decline in their status, yet they were fragmented by various factors such as ethnic and racial divisions, gender disparities, conflicting religious beliefs, differing occupations, political party loyalties, and differences in strategies.",q:"[TOEFL Reading - Activity 29, Q7] The author mentions 'political party loyalties' and 'differences in strategies' as factors that:",options:["A. unified the craftworkers and unskilled factory laborers into one unstoppable political bloc.","B. led to rifts, fragmentation, and divisions within the workforce, preventing unified collective action.","C. compelled factory owners to voluntarily raise baseline wages.","D. accelerated the transition from steam power to electricity."],answer:1,explanation:"ในบทความระบุว่า แม้คนงานจะมีความไม่พอใจในระบบโรงงานเหมือนกัน แต่พวกเขา 'were fragmented by various factors...' ปัจจัยด้านพรรคการเมืองและกลยุทธ์ที่ต่างกันจึงทำให้เกิดความแตกแยก (rifts and divisions) ในหมู่คนงาน",tip:"Fragmented by... = Led to rifts and internal divisions"},{id:47,unit:"Unit 7",topic:"7.2 TOEFL Listening (Student Loans & Work-Study)",type:"listening",hasAudio:!0,audioTitle:"TOEFL Listening: Student Loans & Work-Study Meeting",audioText:"A: Hi, Mr. Sanders. I was thinking that if I don’t start working towards paying off my student loans now, I’m going to feel really burdened and strapped for cash after graduation. So, I was hoping I would be able to join the work study program and get a job on campus. B: You’re a smart student. We can definitely sign you up for the work study program. No problem.",passage:"Listening Conversation 1: Meeting with Academic Advisor Mr. Sanders",q:"🎧 [TOEFL Listening - Activity 30, Q1] Why does the female student come to meet with Mr. Sanders?",options:["A. She needs to appeal a failed examination grade in economics.","B. She wants to join the campus work-study program to start earning money to pay off her student loans.","C. She has already lost her scholarship and wants to drop out of university.","D. She wants to register for an internship in a corporate bank downtown."],answer:1,explanation:"นักศึกษามาพบอาจารย์ที่ปรึกษา Mr. Sanders เพราะต้องการสมัครเข้าร่วมโครงการ work-study ในมหาวิทยาลัยเพื่อเริ่มหาเงินผ่อนชำระหนี้กู้ยืมเพื่อการศึกษา (student loans) ตั้งแต่เนิ่นๆ",tip:"Purpose: Join campus work-study program to pay off student loans"},{id:48,unit:"Unit 7",topic:"7.2 TOEFL Listening (Speaker's Attitude & Implication)",type:"listening",hasAudio:!0,audioTitle:"TOEFL Listening: Mr. Sanders Praise",audioText:"B: You’re a smart student. We can definitely sign you up for the work study program. No problem. Okay, let me get the form really quickly here. Right, okay.",passage:"Listening Conversation 1: Meaning of Mr. Sanders' Comment",q:"🎧 [TOEFL Listening - Activity 30, Q2] Why does Mr. Sanders state, 'You’re a smart student. We can definitely sign you up for the work study program'?",options:["A. He believes the student is making a wise, forward-thinking financial decision for her future.","B. The work-study program is exclusively restricted to students with a perfect 4.0 GPA.","C. He intends to offer her a job as a senior physics researcher immediately.","D. He implies that students who do not take loans are unintelligent."],answer:0,explanation:"Mr. Sanders ชมว่า 'You're a smart student' เพื่อชื่นชมว่าเธอคิดรอบคอบและวางแผนอนาคตทางการเงินได้ดี ที่คิดจะเริ่มผ่อนหนี้ก่อนเรียนจบ ('good decision by thinking ahead about her future')",tip:"Praise: Acknowledging forward-thinking financial planning"},{id:49,unit:"Unit 7",topic:"7.2 TOEFL Listening (Hours of Work Preference)",type:"listening",hasAudio:!0,audioTitle:"TOEFL Listening: 10 vs 20 Hours Work",audioText:"B: You can either apply for a job that requires 10 hours a week or 20 hours a week. I suggest you start with the 10 hours a week, so you don't overload yourself. A: Well, I think I’d rather work 20 hours a week. I mean I want to make money faster and pay off as much of my loans as quickly as possible.",passage:"Listening Conversation 1: Work Hours Discussion",q:"🎧 [TOEFL Listening - Activity 30, Q3] Why does the student initially insist on working 20 hours per week rather than 10?",options:["A. The university regulations forbid any freshman from working fewer than 20 hours.","B. She wants to earn money faster in order to pay off her loans as quickly as possible.","C. Her academic classes only take up two hours per week.","D. The job center does not have any 10-hour positions available."],answer:1,explanation:"นักศึกษาแจ้งเหตุผลว่า 'I think I’d rather work 20 hours a week. I mean I want to make money faster and pay off as much of my loans as quickly as possible.'",tip:"Goal: Make money faster to pay off loans quickly"},{id:50,unit:"Unit 7",topic:"7.2 TOEFL Listening (Preserving Scholarship)",type:"listening",hasAudio:!0,audioTitle:"TOEFL Listening: Scholarship GPA Warning",audioText:"B: Ah, it’s good that you’re thinking ahead, but considering you’re a freshman with a full class schedule, it wouldn’t be wise to increase your workload so much. If your grades slip up, you might not qualify again next year for your current scholarship. A: Well, I really wouldn’t want that to happen. That would just put me into more debt.",passage:"Listening Conversation 1: Academic Warning",q:"🎧 [TOEFL Listening - Activity 30, Q4] Why does Mr. Sanders caution the student about her current academic scholarship?",options:["A. To remind her that slipping grades due to work overload could cause her to lose the scholarship and fall into greater debt.","B. To inform her that scholarships are completely taxable under new federal laws.","C. To announce that the university has canceled all freshman scholarship funds.","D. To suggest that working 20 hours will guarantee an automatic scholarship extension."],answer:0,explanation:"Mr. Sanders เตือนว่าในฐานะที่เป็นนักศึกษาปีหนึ่ง (freshman) และมีตารางเรียนเต็ม หากทำงานหนักเกินไปจนเกรดตก อาจทำให้เสียทุนการศึกษาที่มีอยู่ ('lose current scholarship') ซึ่งจะยิ่งทำให้เป็นหนี้เพิ่มขึ้น",tip:"Warning: Work overload -> lower grades -> lose scholarship -> more debt"},{id:51,unit:"Unit 7",topic:"7.2 TOEFL Listening (Final Outcome)",type:"listening",hasAudio:!0,audioTitle:"TOEFL Listening: Signed Form Resolution",audioText:"B: I’m going to give you permission to work 10 hours a week in the work study program. I’ll sign this form and then you will need to take it to the job center, and they will help you find a job there. Make sure you let them know it’s for a work study position.",passage:"Listening Conversation 1: Final Decision",q:"🎧 [TOEFL Listening - Activity 30, Q5] What is the agreed action plan decided at the end of the meeting?",options:["A. The student will drop out of university to work full-time off-campus.","B. Mr. Sanders signs permission for 10 hours a week, and she will take the form to the campus job center.","C. The student is authorized to work 35 hours a week in the university cafeteria.","D. Mr. Sanders refuses to sign the form until her sophomore year."],answer:1,explanation:"Mr. Sanders ลงนามอนุญาตให้ทำงาน 10 ชั่วโมงต่อสัปดาห์ก่อน และให้นักศึกษานำใบอนุญาตนี้ไปยื่นที่ Job Center ของมหาวิทยาลัยเพื่อจัดหางานสำหรับโครงการ work-study",tip:"Outcome: 10 hours permission signed -> submit form to campus job center"},{id:52,unit:"Unit 7",topic:"7.2 TOEFL Listening (Shakespeare Literature TA)",type:"listening",hasAudio:!0,audioTitle:"TOEFL Listening: Shakespeare Class Discussion",audioText:"A: Oh hey, John? You’re here for Professor Stanton’s Literature Class, right? I was actually wondering, you’re also the TA for Professor Stanton’s Shakespeare class, right? I was thinking of taking that next semester and... B: Aren’t you a freshman? You’ll have to wait until next year to sign up for the class. A: No, I’m a sophomore actually, but I switched my major.",passage:"Listening Conversation 2: Meeting with Teaching Assistant John",q:"🎧 [TOEFL Listening - Activity 31, Q1] What does the female student want to discuss with John, the Teaching Assistant (TA)?",options:["A. She wants him to write her midterm literature paper for her.","B. She wants advice about the workload and suitability of taking Professor Stanton's Shakespeare class next semester.","C. She wants to officially change her major from Literature to Mathematics.","D. She wants to complain about an unfair grading penalty from yesterday."],answer:1,explanation:"นักศึกษามาขอคำแนะนำจาก John ซึ่งเป็น TA วิชา Shakespeare ของ Professor Stanton ว่าภาระงานในวิชานี้เป็นอย่างไร (workload) เพราะเธอวางแผนจะลงเรียนในภาคการศึกษาถัดไป",tip:"Purpose: Inquire about Shakespeare class workload for next semester"},{id:53,unit:"Unit 7",topic:"7.2 TOEFL Listening (Sophomore Clarification)",type:"listening",hasAudio:!0,audioTitle:"TOEFL Listening: Sophomore Status",audioText:"B: Aren’t you a freshman? You’ll have to wait until next year to sign up for the class. A: No, I’m a sophomore actually, but I switched my major which is why I’m just taking Professor Stanton’s Lit class this year. B: Oh, okay. Sorry.",passage:"Listening Conversation 2: Academic Standing",q:"🎧 [TOEFL Listening - Activity 31, Q2] Why did John initially assume that the student was a freshman?",options:["A. She was unfamiliar with the campus library building.","B. She was enrolled in the introductory Literature class, which is normally taken by first-year students.","C. She did not possess a student identification badge.","D. She told him that she had just graduated from high school last week."],answer:1,explanation:"John คิดว่าเธอเป็นเด็กปีหนึ่ง (freshman) เพราะเธอเพิ่งมาลงเรียนวิชาพื้นฐาน Lit class ของ Professor Stanton ซึ่งตามปกติเป็นวิชาของเด็กปีหนึ่ง แต่ความจริงเธอเป็นเด็กปีสอง (sophomore) ที่เพิ่งย้ายสาขาวิชา",tip:"Freshman = ปี 1 | Sophomore = ปี 2 | Junior = ปี 3 | Senior = ปี 4"},{id:54,unit:"Unit 7",topic:"7.2 TOEFL Listening (TA Advice on Workload)",type:"listening",hasAudio:!0,audioTitle:"TOEFL Listening: Two-Week Drop Option",audioText:"B: Well, you could always sign up and see how it goes the first two weeks. And if it seems like too much, you could drop the class and just take it next year when you have more time. A: That’s a good idea. I didn’t even think about that. I forgot we had a couple of weeks to make changes to our schedule after the semester starts.",passage:"Listening Conversation 2: Practical Solution",q:"🎧 [TOEFL Listening - Activity 31, Q4] What pragmatic advice does John give the student regarding the heavy-reading Shakespeare class?",options:["A. Hire a private tutor to summarize the Shakespeare plays for her.","B. Sign up for the class, test the workload during the first two weeks, and drop it before the schedule adjustment deadline if it proves overwhelming.","C. Refuse to take any literature classes until her senior year.","D. Request that the professor exempt her from the reading assignments."],answer:1,explanation:"John แนะนำวิธีแก้ปัญหาว่า ให้ลงทะเบียนเรียนไปก่อน แล้วลองเรียนดูใน 2 สัปดาห์แรก หากรู้สึกว่างานหนักเกินไปค่อยดรอป (drop the class) ภายในช่วงเวลาที่มหาวิทยาลัยอนุญาตให้ปรับเปลี่ยนตารางเรียนได้",tip:"TA's Advice: Sign up -> test for 2 weeks -> drop if overwhelming"},{id:55,unit:"Unit 7",topic:"7.3 TOEFL Speaking (Campus Announcement)",type:"speaking",hasAudio:!0,audioTitle:"TOEFL Speaking: Sculpture Program Elimination",audioText:"The university administration announced yesterday that the sculpture program, a division of the art department, will be eliminated. The main reason is a lack of student interest, reported one administrator. Furthermore, the department’s only sculpture professor is retiring this year. Given the art department’s limited budget, it just doesn’t make sense to hire a new full-time professor to teach sculpture for only a handful of students.",passage:"TOEFL Speaking Task 2 Reading Passage",q:"🎧 [TOEFL Speaking - Activity 32] What two primary justifications were given by the university administration for eliminating the sculpture program?",options:["A. Safety hazards in the stone workshop and student complaints about dust","B. A reported lack of student enrollment and the retirement of the only sculpture professor under a tight budget","C. High cost of imported marble and lack of exhibition hall space","D. A university-wide mandate banning all fine arts degrees"],answer:1,explanation:"ประกาศของมหาวิทยาลัยระบุเหตุผล 2 ประการ: 1) จำนวนนักศึกษาลงทะเบียนน้อย (lack of student interest / low enrollment) และ 2) อาจารย์ผู้สอนประติมากรรมคนเดียวเกษียณอายุ ประกอบกับงบประมาณจำกัดจึงไม่คุ้มที่จะจ้างอาจารย์ประจำคนใหม่",tip:"University's 2 reasons: Low enrollment + Professor retiring with limited budget"},{id:56,unit:"Unit 7",topic:"7.3 TOEFL Speaking (Student Counter-Argument)",type:"speaking",hasAudio:!0,audioTitle:"TOEFL Speaking: Art Student Reaction",audioText:"A: The university’s got it all wrong. The low enrollment isn’t because art majors don’t want to take these classes. The problem is who’s got time to take them when there are so many other requirements. The classes they’re eliminating are all optional electives. The required courses are mostly painting and drawing, and they take up all our time.",passage:"TOEFL Speaking Task 2 Conversation",q:"🎧 [TOEFL Speaking - Activity 32] How does the art student refute the administration's claim that students lack interest in sculpture?",options:["A. She argues that students love sculpture, but heavy mandatory core requirements in painting and drawing leave them with no free elective time.","B. She claims that the online registration portal suffered a technical glitch.","C. She states that sculpture courses were scheduled at midnight.","D. She asserts that students prefer buying finished sculptures from art stores."],answer:0,explanation:"นักศึกษาโต้แย้งว่า ไม่ใช่ว่าเด็กศิลปะไม่สนใจประติมากรรม แต่เพราะวิชาบังคับ (required courses) ด้านภาพวาดและดรออิ้งมีเยอะมากจนกินเวลาทั้งหมด ทำให้ไม่มีเวลาเหลือมาลงเรียนวิชาเลือกประติมากรรม",tip:"Student rebuttal: Not lack of interest, but overloaded with painting/drawing core requirements"},{id:57,unit:"Unit 7",topic:"7.3 TOEFL Speaking (Proposed Budget Solution)",type:"speaking",hasAudio:!0,audioTitle:"TOEFL Speaking: Budget Solutions",audioText:"A: If money’s the problem, they could hire a part-time professor or ask faculty members who have secondary fields in sculpture to step in. At least a few painting teachers are also great sculptors. I’m sure one of them could teach a class.",passage:"TOEFL Speaking Task 2 Proposed Alternatives",q:"🎧 [TOEFL Speaking - Activity 32] What budget-friendly solutions did the student propose to keep the sculpture classes open?",options:["A. Charging art majors triple tuition fees for clay supplies","B. Hiring a part-time professor or having existing painting faculty with sculpture expertise teach the class","C. Replacing the sculpture studio with an automated 3D printer room","D. Forcing students to study sculpture in another country"],answer:1,explanation:"นักศึกษาเสนอทางออกเรื่องงบประมาณว่า มหาวิทยาลัยสามารถจ้างอาจารย์พิเศษพาร์ตไทม์ (part-time professor) หรือให้อาจารย์ผู้สอนวิชาภาพวาดที่มีความเชี่ยวชาญด้านประติมากรรมมาช่วยสอนแทนได้",tip:"Solutions: Hire part-time professor OR utilize existing painting teachers skilled in sculpture"},{id:58,unit:"Unit 7",topic:"7.3 TOEFL Speaking (Academic Lecture on Tools)",type:"speaking",hasAudio:!0,audioTitle:"TOEFL Speaking: Narrow Definition of Tool",audioText:"Human beings are not the only animals that use tools. But when can we say that an object is a tool? Well, there are two competing definitions. A narrow definition says that a tool is an object that is used to perform a specific task, but the object’s got to be purposefully changed or shaped by the animal or human so that it can be used.",passage:"TOEFL Speaking Task 4 Biology Lecture",q:"🎧 [TOEFL Speaking - Activity 33] According to the biology lecture, what is the crucial requirement for an object to be classified as a tool under the 'NARROW definition'?",options:["A. It must be powered by electrical current or steam.","B. It must be purposefully altered, modified, or shaped by the user to perform the task.","C. It must be made from synthetic metallic materials.","D. It must be passed down through genetic inheritance."],answer:1,explanation:"ตามคำนิยามแบบแคบ (narrow definition): วัตถุที่จะนับเป็น 'tool' ได้นั้น ต้องถูกดัดแปลงหรือปรับเปลี่ยนรูปทรงอย่างมีเป้าหมายโดยสัตว์หรือมนุษย์ เพื่อให้ใช้งานได้ ('purposefully changed or shaped')",tip:"Narrow definition = Must be purposefully changed / modified / shaped"},{id:59,unit:"Unit 7",topic:"7.3 TOEFL Speaking (Broad Definition of Tool)",type:"speaking",hasAudio:!0,audioTitle:"TOEFL Speaking: Broad Definition & Elephant Example",audioText:"The broad definition says a tool is any object that is used to perform a specific task without the need for modification. For example, an elephant will sometimes use a stick to scratch its back. It just picks up a stick from the ground and scratches its back with it. It does not modify the stick. Under the broad definition it is a tool, but under the narrow definition it is not.",passage:"TOEFL Speaking Task 4 Biology Lecture",q:"🎧 [TOEFL Speaking - Activity 33] Why is an elephant scratching its back with a stick considered a tool under the 'BROAD definition' but NOT under the 'NARROW definition'?",options:["A. The stick was manufactured in an industrial lumber factory.","B. The elephant uses the stick naturally as found on the ground without modifying or reshaping it in any way.","C. The elephant was formally trained by human researchers in a laboratory.","D. Elephants are biologically incapable of understanding tool usage."],answer:1,explanation:"กรณีช้างหยิบกิ่งไม้มาเกาหลัง นับเป็นเครื่องมือตาม 'นิยามกว้าง' เพราะเป็นวัตถุที่นำมาใช้ทำงานให้บรรลุเป้าหมาย แต่ไม่นับตาม 'นิยามแคบ' เพราะช้างไม่ได้ทำการเหลาหรือดัดแปลงกิ่งไม้นั้นเลย ('uses it just as it is found without modification')",tip:"Broad definition = Any object used for a task | Elephant stick = Unmodified -> Tool in broad, not in narrow"},{id:60,unit:"Unit 7",topic:"7.4 TOEFL Writing (Integrated Phrases & Rebuttal)",type:"writing",hasAudio:!1,q:"[TOEFL Writing - Activity 34] In a TOEFL Integrated Writing task, which linking phrase is most appropriate to introduce the lecturer's disagreement with a reading passage?",options:["A. In conclusion, the author and lecturer share identical beliefs on...","B. The lecturer casts doubt on the reading's claims by pointing out that...","C. As a result of ancient traditions, both texts agree that...","D. Once upon a time, there lived a professor who..."],answer:1,explanation:"ใน TOEFL Integrated Writing ประโยคมาตรฐานระดับวิชาการที่ใช้แสดงว่าผู้บรรยายคัดค้านหรือไม่เห็นด้วยกับบทความ คือ 'The lecturer casts doubt on the reading's claims by pointing out that...' หรือ 'The professor rebuts the argument...'",tip:"TOEFL Integrated Writing phrases: 'casts doubt on', 'rebuts the argument', 'refutes the claim'"},{id:61,unit:"Unit 8",topic:"8.2 TOEIC Listening Part 1: Photographs",type:"listening",hasAudio:!0,audioTitle:"TOEIC Part 1: Photograph of Business Meeting",audioText:"Statement A: They are painting the office walls. Statement B: They are reviewing architectural blueprints on the conference table. Statement C: They are packing luggage into the trunk of a car. Statement D: They are boarding an international flight at the gate.",passage:"TOEIC Part 1 Photograph Description (Scene: Architects & Engineers around a conference table with plans)",q:"🎧 [TOEIC Listening Part 1: Photographs] Look at the scenario of professionals gathered in a conference room with technical plans. Which statement best describes the scene?",options:["A. They are painting the office walls.","B. They are reviewing architectural blueprints on the conference table.","C. They are packing luggage into the trunk of a car.","D. They are boarding an international flight at the gate."],answer:1,explanation:"ในข้อสอบ TOEIC Part 1 (ภาพถ่ายในที่ทำงาน): คำบรรยายที่ถูกต้องตามสถานการณ์การประชุมงานสถาปัตยกรรม/วิศวกรรมคือ 'They are reviewing architectural blueprints on the conference table' (พวกเขากำลังตรวจดูพิมพ์เขียวบนโต๊ะประชุม)",tip:"TOEIC Part 1: สังเกต Action + Object + Location ที่ตรงกับภาพที่สุด"},{id:62,unit:"Unit 8",topic:"8.2 TOEIC Listening Part 2: Question-Response",type:"listening",hasAudio:!0,audioTitle:"TOEIC Part 2: Question-Response (When)",audioText:"Question: When is the revised budget proposal due for the marketing campaign? Choice A: Yes, I enjoyed the marketing seminar. Choice B: It has been extended until next Friday afternoon. Choice C: At the second-floor conference room.",passage:"TOEIC Part 2 Question-Response Audio",q:"🎧 [TOEIC Listening Part 2: Question-Response] Question: 'When is the revised budget proposal due for the marketing campaign?' — Best Response:",options:["A. Yes, I enjoyed the marketing seminar.","B. It has been extended until next Friday afternoon.","C. At the second-floor conference room.","D. Because the printer was out of paper."],answer:1,explanation:"คำถามขึ้นต้นด้วย 'When' (ถามเวลา/กำหนดส่ง) คำตอบตรงประเด็นคือ B 'It has been extended until next Friday afternoon' (เลื่อนกำหนดออกไปเป็นวันศุกร์หน้า) คำตอบขึ้นต้นด้วย Yes/No (A) หรือสถานที่ (C) จึงผิด",tip:"When question -> ห้ามตอบ Yes/No, มองหาคำบอกเวลาหรือกำหนดการ"},{id:63,unit:"Unit 8",topic:"8.2 TOEIC Listening Part 2: Question-Response",type:"listening",hasAudio:!0,audioTitle:"TOEIC Part 2: Question-Response (Who)",audioText:"Question: Who is responsible for organizing the annual regional conference this year? Choice A: Ms. Patterson from Human Resources is in charge of it. Choice B: Yes, the conference was very productive. Choice C: By express courier service.",passage:"TOEIC Part 2 Question-Response Audio",q:"🎧 [TOEIC Listening Part 2: Question-Response] Question: 'Who is responsible for organizing the annual regional conference this year?' — Best Response:",options:["A. Ms. Patterson from Human Resources is in charge of it.","B. Yes, the conference was very productive.","C. By express courier service.","D. About forty-five minutes away."],answer:0,explanation:"คำถามขึ้นต้นด้วย 'Who' (ถามบุคคลหรือตำแหน่งที่รับผิดชอบ) คำตอบที่ถูกต้องคือการระบุตัวบุคคล A: 'Ms. Patterson from Human Resources is in charge of it'",tip:"Who question -> มองหาชื่อคน ตำแหน่ง หรือแผนกที่รับผิดชอบ"},{id:64,unit:"Unit 8",topic:"8.2 TOEIC Listening Part 2: Question-Response (Indirect Answer)",type:"listening",hasAudio:!0,audioTitle:"TOEIC Part 2: Indirect Response",audioText:"Question: Has the technician repaired the color photocopier on the third floor yet? Choice A: He is still waiting for a replacement part to arrive from Bangkok. Choice B: Ten copies per minute, please. Choice C: No, I didn't see the colorful painting.",passage:"TOEIC Part 2 Question-Response Audio",q:"🎧 [TOEIC Listening Part 2: Question-Response] Question: 'Has the technician repaired the color photocopier on the third floor yet?' — Best Response:",options:["A. He is still waiting for a replacement part to arrive from Bangkok.","B. Ten copies per minute, please.","C. No, I didn't see the colorful painting.","D. Upstairs in the executive suite."],answer:0,explanation:"ข้อสอบ TOEIC ยุคปัจจุบันนิยมคำตอบแบบตอบอ้อมๆ (indirect answer) เมื่อถามว่าช่างซ่อมเครื่องถ่ายเอกสารเสร็จหรือยัง คำตอบ A: 'เขายังคงรออะไหล่ส่งมาจากกรุงเทพฯ' บ่งบอกว่ายังซ่อมไม่เสร็จอย่างเป็นธรรมชาติที่สุด",tip:"Indirect response: ช่างยังรออะไหล่ = ยังซ่อมไม่เสร็จ"},{id:65,unit:"Unit 8",topic:"8.2 TOEIC Listening Part 3: Short Conversation",type:"listening",hasAudio:!0,audioTitle:"TOEIC Part 3: Shipment Delay Conversation",audioText:"Man: Rachel, did you hear that the shipment of microchips from Singapore has been delayed due to severe thunderstorms? Woman: Oh no, our demonstration with the international clients is scheduled for tomorrow morning! Man: Don’t worry, I will contact the client right away to explain the weather disruption and reschedule the presentation for Thursday afternoon.",passage:"TOEIC Part 3 Short Conversation Dialogue",q:"🎧 [TOEIC Listening Part 3: Short Conversation] Why has the shipment of components been delayed, and what does the man plan to do?",options:["A. The supplier went bankrupt; the man will cancel the contract completely.","B. Severe thunderstorms disrupted transport; the man will call the client to reschedule the meeting for Thursday.","C. The courier lost the address; the man will fly to Singapore immediately.","D. The products failed safety testing; the man will order cheaper alternatives."],answer:1,explanation:"ในบทสนทนา ผู้ชายแจ้งว่าการส่งพัสดุล่าช้าเพราะพายุฝนฟ้าคะนองรุนแรง ('delayed due to severe thunderstorms') และเขากำลังจะติดต่อลูกค้าทันทีเพื่อเลื่อนการนำเสนอไปเป็นบ่ายวันพฤหัสบดี ('reschedule the presentation for Thursday afternoon')",tip:"Part 3: ฟังสาเหตุของปัญหา (severe thunderstorms) + ทางออก (reschedule meeting)"},{id:66,unit:"Unit 8",topic:"8.2 TOEIC Listening Part 4: Short Talk",type:"listening",hasAudio:!0,audioTitle:"TOEIC Part 4: Airport Gate Change Announcement",audioText:"Attention passengers on Skylink Airways Flight 402 departing for Tokyo Narita. Due to routine aircraft maintenance, your departure gate has been moved from Gate B8 to Gate C15. Boarding will commence at approximately 4:30 PM. Any passengers requiring special boarding assistance or traveling with small children are requested to report directly to the customer service counter at Gate C15.",passage:"TOEIC Part 4 Short Talk Airport Announcement",q:"🎧 [TOEIC Listening Part 4: Short Talk] What is the primary purpose of the recorded airport announcement?",options:["A. To announce the indefinite cancellation of all Tokyo flights due to a typhoon","B. To notify passengers that Flight 402 has been relocated to Gate C15 and will board at 4:30 PM","C. To ask passengers to collect lost baggage from customs","D. To offer discounted duty-free shopping vouchers to business class travelers"],answer:1,explanation:"ประกาศของสนามบินมีวัตถุประสงค์เพื่อแจ้งให้ผู้โดยสารเที่ยวบิน 402 ไปโตเกียวทราบว่า ได้มีการเปลี่ยนประตูขึ้นเครื่องจาก Gate B8 ไปยัง Gate C15 และจะเริ่มขึ้นเครื่องเวลาประมาณ 16:30 น.",tip:"Announcement purpose = Inform passengers of departure gate change and boarding time"},{id:67,unit:"Unit 8",topic:"8.1 TOEIC Reading Part 5: Prepositions & Connectors",type:"grammar",hasAudio:!1,q:"[TOEIC Part 5: Connectors] __________ the unexpected delay in international shipping, the engineering team managed to finish the installation before the client deadline.",options:["A. Although","B. Because","C. Despite","D. While"],answer:2,explanation:"ส่วนที่ตามหลังช่องว่างคือ 'the unexpected delay in international shipping' ซึ่งเป็นกลุ่มคำนาม (Noun Phrase) ไม่มีประธานและกริยาแท้ ดังนั้นจึงต้องใช้ Preposition 'Despite' (หรือ In spite of) ในขณะที่ Although และ While ต้องตามด้วยประโยค (Clause: S + V)",tip:"Despite + Noun Phrase | Although / Even though + S + V"},{id:68,unit:"Unit 8",topic:"8.1 TOEIC Reading Part 5: Verb Tenses (Since)",type:"grammar",hasAudio:!1,q:"[TOEIC Part 5: Verb Tense] Ms. Singha __________ as the chief laboratory supervisor at the biotechnology center since she graduated from Maejo University.",options:["A. works","B. is working","C. has worked","D. worked"],answer:2,explanation:"เมื่อมีโครงสร้าง 'since + Past Simple (she graduated)' ประโยคหลักจะต้องใช้ Present Perfect Tense (has/have + V.3) เสมอ เพื่อแสดงเหตุการณ์ที่เริ่มทำในอดีตและยังดำเนินต่อเนื่องมาจนถึงปัจจุบัน ดังนั้นจึงใช้ 'has worked'",tip:"S + has/have + V.3 + since + Past Simple (จุดเริ่มต้นในอดีต)"},{id:69,unit:"Unit 8",topic:"8.1 TOEIC Reading Part 5: Noun Adjuncts / Collocations",type:"grammar",hasAudio:!1,q:"[TOEIC Part 5: Word Form] To be officially considered for the scholarship, all applicants must submit a completed __________ form along with their academic transcripts.",options:["A. apply","B. application","C. applicable","D. applicant"],answer:1,explanation:"คำนามประสม (Compound noun / Noun adjunct): เราใช้คำว่า 'application form' แปลว่า 'แบบฟอร์มใบสมัคร' (คำนาม application ขยายคำนาม form)",tip:"Application form = แบบฟอร์มใบสมัคร (ไม่ใช่ apply form หรือ applicant form)"},{id:70,unit:"Unit 8",topic:"8.1 TOEIC Reading Part 5: Adverb Placement",type:"grammar",hasAudio:!1,q:"[TOEIC Part 5: Word Form] The renewable energy enterprise has grown __________ throughout Southeast Asia over the past three fiscal quarters.",options:["A. rapid","B. rapidity","C. rapidly","D. rapidness"],answer:2,explanation:"ช่องว่างอยู่หลังกริยา 'has grown' ซึ่งเป็นกริยาแท้ จึงต้องการ Adverb (กริยาวิเศษณ์ที่ลงท้ายด้วย -ly) เข้ามาทำหน้าที่ขยายกริยา grown -> 'grown rapidly' (เติบโตอย่างรวดเร็ว)",tip:"Verb + Adverb (-ly) -> grow rapidly, expand quickly"},{id:71,unit:"Unit 8",topic:"8.1 TOEIC Reading Part 5: Subject-Verb Agreement",type:"grammar",hasAudio:!1,q:"[TOEIC Part 5: Grammar] Neither the project supervisor nor the civil engineers __________ willing to sign off on the building inspection report without verified soil tests.",options:["A. was","B. were","C. is","D. has been"],answer:1,explanation:"กฎไวยากรณ์ Subject-Verb Agreement: ในโครงสร้าง 'Neither A nor B' กริยาแท้จะต้องผันตามประธานตัวหลัง (B) ซึ่งในที่นี้คือ 'the civil engineers' (พหูพจน์) ดังนั้นจึงต้องใช้กริยาพหูพจน์ในอดีตคือ 'were'",tip:"Neither A nor B -> กริยาผันตามประธาน B (ตัวที่อยู่ใกล้กริยาที่สุด)"},{id:72,unit:"Unit 8",topic:"8.1 TOEIC Reading Part 5: Conditionals",type:"grammar",hasAudio:!1,q:"[TOEIC Part 5: Conditionals] If the logistics team had dispatched the replacement server parts yesterday, the network outage __________ much more quickly.",options:["A. would resolve","B. will resolve","C. would have been resolved","D. is resolved"],answer:2,explanation:"ประโยคเงื่อนไขแบบที่ 3 (Third Conditional: สมมติเหตุการณ์ในอดีตที่ตรงข้ามกับความเป็นจริง): โครงสร้างคือ If + Past Perfect (had dispatched), S + would have + V.3 (passive: would have been resolved)",tip:"If + had + V.3, S + would have + V.3"},{id:73,unit:"Unit 8",topic:"8.1 TOEIC Reading Part 5: Business Vocabulary",type:"vocabulary",hasAudio:!1,q:"[TOEIC Part 5: Vocabulary] As a gesture of goodwill for the delayed hotel check-in, the front desk manager offered the guests a __________ suite upgrade for their entire weekend stay.",options:["A. complimentary","B. mandatory","C. reluctant","D. pessimistic"],answer:0,explanation:"'Complimentary' (adj.) หมายถึง ให้ฟรีโดยไม่คิดมูลค่า หรือเป็นอภินันทนาการจากทางโรงแรม (free of charge / given as a courtesy) ตัวอย่างเช่น complimentary breakfast หรือ complimentary upgrade",tip:"Complimentary = ฟรี, เป็นอภินันทนาการ | Mandatory = บังคับ"},{id:74,unit:"Unit 8",topic:"8.1 TOEIC Reading Part 5: Business Vocabulary",type:"vocabulary",hasAudio:!1,q:"[TOEIC Part 5: Vocabulary] The finance department will process your travel expense __________ within five business days after original receipts are submitted.",options:["A. resignation","B. reimbursement","C. reservation","D. relocation"],answer:1,explanation:"'Reimbursement' (noun) แปลว่า การเบิกเงินชดเชย หรือการจ่ายเงินคืนสำหรับค่าใช้จ่ายที่สำรองจ่ายไปก่อน (repayment for expenses incurred on behalf of the company)",tip:"Expense reimbursement = การเบิกเงินค่าใช้จ่ายคืน"},{id:75,unit:"Unit 8",topic:"8.1 TOEIC Reading Part 5: Business Vocabulary",type:"vocabulary",hasAudio:!1,q:"[TOEIC Part 5: Vocabulary] Attendance at the annual corporate data protection and cybersecurity briefing is __________ for all personnel.",options:["A. optional","B. mandatory","C. flexible","D. disposable"],answer:1,explanation:"'Mandatory' (adj.) แปลว่า เป็นข้อบังคับ, จำเป็นต้องทำตามกฎหมายหรือระเบียบบริษัท (compulsory / required by rule)",tip:"Mandatory = บังคับ ต้องเข้าร่วมทุกคน (ตรงข้ามกับ optional)"},{id:76,unit:"Unit 8",topic:"8.1 TOEIC Reading Part 5: Business Vocabulary",type:"vocabulary",hasAudio:!1,q:"[TOEIC Part 5: Vocabulary] Prior to embarking on the overseas business trip, please verify that your travel __________ contains all hotel booking confirmations and flight details.",options:["A. itinerary","B. inventory","C. invoice","D. infrastructure"],answer:0,explanation:"'Itinerary' (noun) หมายถึง แผนการเดินทาง กำหนดการเดินทางอย่างละเอียด (a detailed planned route or schedule of a journey)",tip:"Travel itinerary = กำหนดการเดินทาง / Invoice = ใบแจ้งหนี้ / Inventory = สินค้าคงคลัง"},{id:77,unit:"Unit 8",topic:"8.3-8.4 Workplace Email Etiquette & Abbreviations",type:"reading",hasAudio:!1,q:"[TOEIC Part 6/7: Workplace Email Etiquette] In professional business emails and task assignments, what does the common abbreviation 'EOD' stand for?",options:["A. Every Other Day","B. End of the Day","C. Executive Office Director","D. Early Order Discount"],answer:1,explanation:"ตามหัวข้อ Workplace Email Etiquette ในหนังสือเรียน: ตัวย่อ 'EOD' ย่อมาจาก 'End of the Day' (ภายในสิ้นวันทำการ หรือเวลาเลิกงาน เช่น กรุณาส่งรายงานภายใน EOD)",tip:"EOD = End of the Day (สิ้นวันทำการ) | COB = Close of Business"},{id:78,unit:"Unit 8",topic:"8.3-8.4 Workplace Email Etiquette & Abbreviations",type:"reading",hasAudio:!1,q:"[TOEIC Part 6/7: Workplace Abbreviations] Match the standard professional acronyms: What do 'FYI' and 'ASAP' signify in corporate correspondence?",options:["A. For Your Information; As Soon As Possible","B. Free Yearly Insurance; All Systems Are Protected","C. From Your Instructor; Always Send All Papers","D. Financial Year Income; Annual Sales And Profit"],answer:0,explanation:"ในวัฒนธรรมอีเมลธุรกิจ: 'FYI' ย่อมาจาก 'For Your Information' (แจ้งเพื่อทราบ) และ 'ASAP' ย่อมาจาก 'As Soon As Possible' (เร็วที่สุดเท่าที่จะเป็นไปได้)",tip:"FYI = For Your Information | ASAP = As Soon As Possible"},{id:79,unit:"Unit 8",topic:"8.3-8.4 Workplace Email Abbreviations",type:"reading",hasAudio:!1,q:"[TOEIC Part 6/7: Workplace Abbreviations] When tracking flight arrivals or project delivery dates in logistics emails, the acronym 'ETA' stands for __________.",options:["A. Estimated Time of Arrival","B. Electronic Transfer Authorization","C. Emergency Transport Association","D. Expected Tax Assessment"],answer:0,explanation:"'ETA' ย่อมาจาก 'Estimated Time of Arrival' หมายถึง เวลาโดยประมาณที่ของหรือคนจะเดินทางมาถึง",tip:"ETA = Estimated Time of Arrival (เวลาที่จะมาถึงโดยประมาณ)"},{id:80,unit:"Unit 8",topic:"8.3-8.4 Email CC vs BCC Etiquette",type:"reading",hasAudio:!1,q:"[TOEIC Part 6/7: Email Etiquette] When sending a confidential workplace email to multiple external clients where recipients’ email addresses must remain hidden from each other, which field must be used?",options:["A. CC (Carbon Copy)","B. BCC (Blind Carbon Copy)","C. Subject line","D. Attachment preview"],answer:1,explanation:"BCC (Blind Carbon Copy) คือการส่งสำเนาลับ โดยที่ผู้รับคนอื่นๆ ในอีเมลจะไม่สามารถมองเห็นที่อยู่อีเมลของผู้ที่อยู่ในช่อง BCC ได้ จึงใช้เพื่อรักษาความเป็นส่วนตัวและความปลอดภัยของข้อมูล",tip:"CC = เห็นอีเมลทุกคน | BCC (Blind) = ซ่อนอีเมลผู้รับทุกคนเป็นความลับ"}];function Yf({totalScore:p,totalQuestions:x,unitScores:f,onClose:T,onViewMistakes:L,onReset:A}){const j=(p/x*100).toFixed(1),$=(p/x*25).toFixed(2);let b="A",_="text-emerald-600",M="ยอดเยี่ยมมาก! มีความพร้อมในการสอบสูงสุด";j<50?(b="F",_="text-red-600",M="ควรทบทวนเนื้อหาและฝึกทำโจทย์เพิ่มเติมอีกครั้ง"):j<60?(b="D",_="text-amber-600",M="ผ่านเกณฑ์ขั้นต่ำ ควรศึกษาเฉลยและจุดที่ตอบผิด"):j<70?(b="C",_="text-blue-600",M="ผ่านเกณฑ์ระดับมาตรฐาน ทำได้ดีในหลายส่วน"):j<80&&(b="B",_="text-indigo-600",M="ผลการเร
